<h1>פרופילים</h1>
<div class="actions-row">
  <button mat-raised-button color="primary" (click)="create()">פרופיל חדש</button>
</div>
<table mat-table [dataSource]="profiles" class="mat-elevation-z2 full nps-table">
  <ng-container matColumnDef="ProfileID">
    <th mat-header-cell *matHeaderCellDef>#</th>
    <td mat-cell *matCellDef="let r">{{ r.ProfileID }}</td>
  </ng-container>
  <ng-container matColumnDef="ProfileCode">
    <th mat-header-cell *matHeaderCellDef>קוד</th>
    <td mat-cell *matCellDef="let r">{{ r.ProfileCode }}</td>
  </ng-container>
  <ng-container matColumnDef="ProfileName">
    <th mat-header-cell *matHeaderCellDef>שם</th>
    <td mat-cell *matCellDef="let r">{{ r.ProfileName }}</td>
  </ng-container>
  <ng-container matColumnDef="Description">
    <th mat-header-cell *matHeaderCellDef>תיאור</th>
    <td mat-cell *matCellDef="let r">{{ r.Description }}</td>
  </ng-container>
  <ng-container matColumnDef="Actions">
    <th mat-header-cell *matHeaderCellDef>פעולות</th>
    <td mat-cell *matCellDef="let r">
      <button mat-icon-button color="primary" (click)="edit(r.ProfileID)"><mat-icon>edit</mat-icon></button>
      <button mat-icon-button color="primary" (click)="view(r.ProfileID)"><mat-icon>visibility</mat-icon></button>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="cols"></tr>
  <tr mat-row *matRowDef="let row; columns: cols"></tr>
</table>
