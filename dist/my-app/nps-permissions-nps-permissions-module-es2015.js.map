<h1>בקשה #{{ detail?.RequestID }}</h1>
<app-nps-request-status-badge *ngIf="detail" [status]="detail.Status"></app-nps-request-status-badge>
<p class="meta-line">עובד: {{ detail?.EmployeeID }} · פרופיל: {{ detail?.TargetProfileName }}</p>
<app-nps-approval-timeline [steps]="detail?.steps"></app-nps-approval-timeline>
<div class="actions" *ngIf="detail?.Status === 'Pending'">
  <mat-form-field appearance="outline" class="wide">
    <mat-label>הערות</mat-label>
    <input matInput [(ngModel)]="comments" />
  </mat-form-field>
  <div>
    <button mat-raised-button color="primary" (click)="approve()">אשר</button>
    <button mat-stroked-button color="warn" (click)="reject()">דחה</button>
  </div>
</div>
