<!-- Group Buttons Section -->
<div id="group-buttons">
  <h3>Select Department Group</h3>
  <div>
    <!-- Group buttons -->
    <div *ngFor="let group of deptGroups">
      <button (click)="loadGroupDashboard(group)">
        {{ group }}
      </button>
    </div>

    <!-- Render sub-dashboard here -->
    <ng-template #groupHost></ng-template>
  </div>
</div>
