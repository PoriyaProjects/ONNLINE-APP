<h1>יומן ביקורת</h1>
<table mat-table [dataSource]="rows" class="mat-elevation-z2 full">
  <ng-container matColumnDef="AuditID">
    <th mat-header-cell *matHeaderCellDef>#</th>
    <td mat-cell *matCellDef="let r">{{ r.AuditID }}</td>
  </ng-container>
  <ng-container matColumnDef="ActorEmployeeID">
    <th mat-header-cell *matHeaderCellDef>מבצע</th>
    <td mat-cell *matCellDef="let r">{{ r.ActorEmployeeID }}</td>
  </ng-container>
  <ng-container matColumnDef="ActionCode">
    <th mat-header-cell *matHeaderCellDef>פעולה</th>
    <td mat-cell *matCellDef="let r">{{ r.ActionCode }}</td>
  </ng-container>
  <ng-container matColumnDef="EntityType">
    <th mat-header-cell *matHeaderCellDef>ישות</th>
    <td mat-cell *matCellDef="let r">{{ r.EntityType }} {{ r.EntityID }}</td>
  </ng-container>
  <ng-container matColumnDef="CreatedUTC">
    <th mat-header-cell *matHeaderCellDef>מועד</th>
    <td mat-cell *matCellDef="let r">{{ r.CreatedUTC | date: 'short' }}</td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="cols"></tr>
  <tr mat-row *matRowDef="let row; columns: cols"></tr>
</table>
