<div class="nps-page">
  <header class="nps-page-header">
    <div class="nps-page-header-main">
      <h1 class="nps-page-title">פרופילים</h1>
      <p class="nps-page-subtitle">ניהול פרופילי הרשאות לפי מחלקה, השכלה והתמחות</p>
    </div>
    <div class="nps-page-actions">
      <button mat-raised-button color="primary" (click)="create()">פרופיל חדש</button>
    </div>
  </header>

  <section class="nps-section">
    <div class="nps-section-title">
      <div class="nps-section-title-main">
        <mat-icon>badge</mat-icon>
        רשימת פרופילים
      </div>
    </div>

    <div class="nps-table-wrap">
      <div class="nps-table-scroll">
        <table mat-table [dataSource]="profiles" class="full nps-table">
          <ng-container matColumnDef="ProfileID">
            <th mat-header-cell *matHeaderCellDef>#</th>
            <td mat-cell *matCellDef="let r">{{ r.ProfileID }}</td>
          </ng-container>
          <ng-container matColumnDef="ProfileName">
            <th mat-header-cell *matHeaderCellDef>שם</th>
            <td mat-cell *matCellDef="let r">{{ r.ProfileName }}</td>
          </ng-container>
          <ng-container matColumnDef="Description">
            <th mat-header-cell *matHeaderCellDef>תיאור</th>
            <td mat-cell *matCellDef="let r">{{ r.Description }}</td>
          </ng-container>
          <ng-container matColumnDef="DepartnentCode">
            <th mat-header-cell *matHeaderCellDef>מחלקה</th>
            <td mat-cell *matCellDef="let r">{{ deptLabel(r.DepartnentCode) }}</td>
          </ng-container>
          <ng-container matColumnDef="EducationID">
            <th mat-header-cell *matHeaderCellDef>השכלה</th>
            <td mat-cell *matCellDef="let r">{{ educationLabel(r.EducationID) }}</td>
          </ng-container>
          <ng-container matColumnDef="SpecialityID">
            <th mat-header-cell *matHeaderCellDef>התמחות</th>
            <td mat-cell *matCellDef="let r">{{ specialtyLabel(r.SpecialityID) }}</td>
          </ng-container>
          <ng-container matColumnDef="Actions">
            <th mat-header-cell *matHeaderCellDef>פעולות</th>
            <td mat-cell *matCellDef="let r">
              <button mat-icon-button color="primary" (click)="edit(r.ProfileID)"><mat-icon>edit</mat-icon></button>
              <button mat-icon-button color="primary" (click)="view(r.ProfileID)"><mat-icon>visibility</mat-icon></button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="cols"></tr>
          <tr mat-row *matRowDef="let row; columns: cols"></tr>
        </table>
      </div>
    </div>
  </section>
</div>
