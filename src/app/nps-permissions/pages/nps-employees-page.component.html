<h1>עובדים</h1>
<app-nps-filters-toolbar [departments]="departments" (filterChange)="onFilter($event)"></app-nps-filters-toolbar>
<table mat-table [dataSource]="rows" class="mat-elevation-z2 full">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>מזהה</th>
    <td mat-cell *matCellDef="let r">{{ r.EmployeeID }}</td>
  </ng-container>
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>שם</th>
    <td mat-cell *matCellDef="let r">{{ r.FirstName }} {{ r.LastName }}</td>
  </ng-container>
  <ng-container matColumnDef="dept">
    <th mat-header-cell *matHeaderCellDef>מחלקה</th>
    <td mat-cell *matCellDef="let r">{{ r.DepartnentCode }}</td>
  </ng-container>
  <ng-container matColumnDef="act">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let r">
      <button mat-button (click)="go(r.EmployeeID)">פרטים</button>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="cols"></tr>
  <tr mat-row *matRowDef="let row; columns: cols"></tr>
</table>
