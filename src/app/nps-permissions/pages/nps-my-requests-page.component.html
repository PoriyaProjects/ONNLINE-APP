<h1>הבקשות שלי</h1>
<table mat-table [dataSource]="rows" class="mat-elevation-z2 full nps-table">
  <ng-container matColumnDef="RequestID">
    <th mat-header-cell *matHeaderCellDef>#</th>
    <td mat-cell *matCellDef="let r">{{ r.RequestID }}</td>
  </ng-container>
  <ng-container matColumnDef="Status">
    <th mat-header-cell *matHeaderCellDef>סטטוס</th>
    <td mat-cell *matCellDef="let r"><app-nps-request-status-badge [status]="r.Status"></app-nps-request-status-badge></td>
  </ng-container>
  <ng-container matColumnDef="Actions">
    <th mat-header-cell *matHeaderCellDef>פעולות</th>
    <td mat-cell *matCellDef="let r">
      <button mat-icon-button color="primary" (click)="go(r.RequestID)"><mat-icon>visibility</mat-icon></button>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="cols"></tr>
  <tr mat-row *matRowDef="let row; columns: cols"></tr>
</table>
