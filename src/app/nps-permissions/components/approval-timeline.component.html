<mat-vertical-stepper *ngIf="steps?.length" [linear]="false">
  <mat-step *ngFor="let s of steps" [completed]="s.status === 'Approved'" [editable]="false">
    <ng-template matStepLabel>
      שלב {{ s.stepOrder }} - {{ s.approverName || s.approverEmployeeId }} ({{ s.status }})
    </ng-template>
    <p *ngIf="s.actionUtc">{{ s.actionUtc | date: 'short' }}</p>
    <p *ngIf="s.comments">{{ s.comments }}</p>
  </mat-step>
</mat-vertical-stepper>
<p *ngIf="!steps?.length">אין שלבים</p>
