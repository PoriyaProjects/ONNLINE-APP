<mat-toolbar class="nps-filters" color="primary">
  <mat-form-field appearance="outline" class="grow">
    <mat-label>חיפוש</mat-label>
    <input matInput [(ngModel)]="searchText" (keyup.enter)="emit()" />
  </mat-form-field>
  <mat-form-field appearance="outline" *ngIf="departments?.length">
    <mat-label>מחלקה</mat-label>
    <mat-select [(ngModel)]="DepartnentCode">
      <mat-option value="">הכל</mat-option>
      <mat-option *ngFor="let d of departments" [value]="d.DepartnentCode">
        {{ d.DepartnentDescripton || d.DepartnentCode }}
      </mat-option>
    </mat-select>
  </mat-form-field>
  <button mat-stroked-button type="button" (click)="emit()">החל</button>
</mat-toolbar>
