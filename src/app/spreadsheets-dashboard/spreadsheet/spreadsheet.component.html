<input type="text" class="title-bar" placeholder="כותרת חדשה" [(ngModel)]="sheet_details.SheetName"
    (blur)="onCellSave(null)" />
<!--  [showFormulaBar]="false" -->
<ejs-spreadsheet #spreadsheet (cellSave)="onCellSave($event)" [enableRtl]="true" [showRibbon]="false"
    [allowDataValidation]="true" [allowScrolling]="true">
    <e-sheets>
        <e-sheet>
            <e-ranges>
                <e-range [dataSource]='data'></e-range>
            </e-ranges>
            <e-columns>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
                <e-column [width]=120></e-column>
            </e-columns>
        </e-sheet>
    </e-sheets>
</ejs-spreadsheet>
