<table style="margin:0 20px; width:560px; display:block;">
    <thead style="border-bottom: solid 1px #777;width:560px; display:block;">
    <tr>
      <th style="text-align: right;width:500px">סוג פרוצדורה</th>
      <th style="transform: rotate(-20deg);font-size:0.8rem;width:14%;">החודש</th>
      <th style="transform: rotate(-20deg);font-size:0.8rem;width:14%;">קודם</th>
      <th style="transform: rotate(-20deg);font-size:0.8rem;width:14%;">סה"כ</th>
    </tr>
  </thead>
  <tbody style="height:168px; overflow-y: scroll; width:560;display:block;">

    <tr *ngFor="let item of summary | keyvalue: compareTotals"  style="border-bottom: solid 1px #999;">
      <td style="text-align: right;">{{ item.key }}</td>
      <td style="width:14%">{{ item.value.thisMonth }}</td>
      <td style="width:14%">{{ item.value.prevMonth }}</td>
      <td style="width:14%">{{ item.value.total }}</td>
    </tr>
  </tbody>
</table>
