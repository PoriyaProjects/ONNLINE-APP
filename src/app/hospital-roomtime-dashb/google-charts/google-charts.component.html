<style>
    .tabs {
  margin-bottom: 15px;
}

.tabs button {
  padding: 10px 20px;
  margin-right: 5px;
  background: #f0f0f0;
  border: 1px solid #ccc;
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.2s ease;
}

.tabs button:hover {
  background: #e6e6e6;
}

.tabs button.active {
  background: #6ba1f8;
  color: #fff;
  border-color: #6ba1f8;
  font-weight: bold;
}
</style>
<div class="mdc-layout-grid" style="direction: rtl;">
    <div class="row" style="text-align: center;">
        <div class="mdc-layout-grid__cell col-md-12">
            <h1 class="page-title text-center" style="text-align: center;">
                זמן אבוד (איחור + אובדן + עודף setup time)
            </h1>
        </div>
        <div class="row">
            <div class="mdc-layout-grid__cell col-md-12">

            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="mdc-layout-grid__cell col-md-12">

            <main class="mdc-top-app-bar--fixed-adjust">
                 <!-- Tabs -->
                 <div class="tabs" style="text-align: right; margin: bottom 20px;">
                    <button (click)="onTabChange('avg')" [class.active]="activeTab === 'avg'" style="border:solid 1px #777;margin-left:20px;" >זמן ממוצע</button>
                    <button (click)="onTabChange('agg')" [class.active]="activeTab === 'agg'" style="border:solid 1px #777;margin-left:20px;">מספר ימים</button>
                  </div>

                <div class="filters" style="text-align: right;">
                    <label *ngFor="let type of dataTypes" style="padding-left:10px;">
                      <input
                        type="radio"
                        name="dataType"
                        [value]="type.value"
                        [(ngModel)]="selectedDataType"
                        (change)="onDataTypeChange()"
                      />
                      {{ type.label }}
                    </label>
                  </div>
                  
                 
                  
                  <!-- AvgTime Charts -->
                  <div *ngIf="activeTab === 'avg'">
                    <div id="chartMorningDelayAvg"  class="card text-center" style="width: 100%; height: 400px;margin-bottom:80px ;"></div>
                    <div id="chartLostDaysAvg"  class="card text-center" style="width: 100%; height: 400px; margin-bottom:80px ;"></div>
                    <div id="chartSetupTimeAvg"  class="card text-center" style="width: 100%; height: 400px; margin-bottom:80px ;"></div>
                  </div>
                  
                  <!-- AggregateDays Charts -->
                  <div *ngIf="activeTab === 'agg'">
                    <div id="chartMorningDelayAgg"  class="card text-center" style="width: 100%; height: 400px; margin-bottom:80px ;"></div>
                    <div id="chartLostDaysAgg"  class="card text-center" style="width: 100%; height: 400px; margin-bottom:80px ;"></div>
                    <div id="chartSetupTimeAgg"  class="card text-center" style="width: 100%; height: 400px; margin-bottom:80px ;"></div>
                  </div>
                  
            </main>
            <div style="height:60px;"></div>
        </div>
    </div>
</div>

<hr />
