
<mat-dialog-content class="mat-typography">
    <form
        dir="rtl"
        id="BoxEmployeeFormID"
        class="form col"
        [formGroup]="BoxEmployee"
        (ngSubmit)="onSubmit()"
    >
        <div class="modal-header text-right">
            <h4 class="modal-title text-center">קרטון</h4>            
        </div>
        <div class="modal-body">
            <div class="row">
                <div class="col-4">
                    <div class="form-group">
                        <mat-form-field>
                            <input
                                matInput
                                autocomplete="off"
                                class="form-control"
                                placeholder="ת.ז"
                                formControlName="EmployeeID"
                                required
                                (blur)="onInputEmployeeIDBlur($event)"
                                type="tel"
                            />
                        </mat-form-field>
                    </div>
                </div>
                <div class="col-4">
                    <div class="form-group">
                        <mat-form-field>
                            <input
                                matInput
                                autocomplete="off"
                                class="form-control"
                                placeholder="שם פרטי"
                                formControlName="EmployeeFirstName"
                                required
                                type="text"
                            />
                        </mat-form-field>
                    </div>
                </div>
                <div class="col-4">
                    <div class="form-group">
                        <mat-form-field>
                            <input
                                matInput
                                autocomplete="off"
                                class="form-control"
                                placeholder="שם משפחה"
                                formControlName="EmployeeLastName"
                                required
                                type="text"
                            />
                        </mat-form-field>
                    </div>
                </div>
                <div class="col-4">
                    <div class="form-group">
                        <mat-form-field>
                            <input
                                matInput
                                autocomplete="off"
                                class="form-control"
                                placeholder="מין"
                                formControlName="EmployeeGender"
                                required
                                type="text"
                            />
                        </mat-form-field>
                    </div>
                </div>
                <div class="col-4">
                    <div class="form-group">
                        <mat-form-field>
                            <input
                                matInput
                                autocomplete="off"
                                class="form-control"
                                placeholder="תאריך לידה"
                                formControlName="EmployeeDOB"
                                required
                                type="date"
                            />
                        </mat-form-field>
                    </div>
                </div>
            </div>
            <div class="row">
                <section class="example-section">
                    <span *ngFor="let cat of WorkerCaseCats">
                        &nbsp;&nbsp;&nbsp;<mat-checkbox class="example-margin"  (change)="checkValue($event, cat)">{{cat.CatName}}</mat-checkbox>&nbsp;&nbsp;&nbsp;
                    </span>
                    
                  </section>
              
            </div>
        </div>
        <div class="modal-footer text-left">
            <button type="submit" class="btn btn-outline-dark">שמור</button>
        </div>
    </form>
</mat-dialog-content>
