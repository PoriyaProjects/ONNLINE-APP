<h2 class="page-title text-center">{{UserName}} - ניהול בקשות תמיכת גוף מסחרי </h2>
<div dir="rtl" class="dashboard-container">
  <!-- <mat-toolbar color="primary" class="toolbar">
    <span>ניהול בקשות תמיכת גוף מסחרי</span>
  </mat-toolbar> -->

  <div class="dashboard-content">

    <!-- Search / Filters -->
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>חיפוש לפי שם מגיש הבקשה</mat-label>
      <input matInput (input)="applyFilter($event)" placeholder="הקלד שם...">
      <button mat-button *ngIf="searchValue" matSuffix mat-icon-button aria-label="Clear" (click)="clearFilter()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>

    <!-- Data Table -->
    <div class="table-container">
      <table mat-table [dataSource]="supportRequests" matSort class="mat-elevation-z2">

        <!-- Requester Name Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>מספר הבקשה</th>
          <td mat-cell *matCellDef="let element">{{ element.Id }}</td>
        </ng-container>

        <!-- Requester Name Column -->
        <ng-container matColumnDef="requestType">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>סוג הבקשה</th>
          <td mat-cell *matCellDef="let element">{{ element.RequestType }}</td>
        </ng-container>

        <!-- Requester Name Column -->
        <ng-container matColumnDef="requester">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>מגיש הבקשה</th>
          <td mat-cell *matCellDef="let element">{{ element.Requester }}</td>
        </ng-container>

        <!-- Conference Name Column -->
        <ng-container matColumnDef="conferenceName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>תאור</th>
          <td mat-cell *matCellDef="let element">{{ element.Name }}</td>
        </ng-container>

        <!-- Event Date Column -->
        <ng-container matColumnDef="insertedDate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>תאריך הבקשה</th>
          <td mat-cell *matCellDef="let element">{{ element.InsertedDate | date: 'dd-MM-yyyy' }}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>פעולות</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="primary" (click)="editRequest('A', element)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteRequest(element.Id)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>
    </div>

    <!-- No Results -->
    <div *ngIf="supportRequests.filteredData.length === 0" class="no-results">
      אין תוצאות להצגה.
    </div>
    <button mat-raised-button color="primary" (click)="openDialog()">
      <mat-icon>add</mat-icon> הוספת בקשה חדשה
    </button>
  </div>
</div>

<ng-template #requestDialog>
  <div dir="rtl">
    <h2 mat-dialog-title>בחר סוג בקשה</h2>
    <mat-dialog-content>
      <div class="cube-options">
        <button mat-raised-button color="accent" class="cube" (click)="selectRequest('A')">בקשה לאישור תמיכת גוף מסחרי –
          כנס/השתלמות</button>
        <button mat-raised-button color="primary" class="cube" (click)="selectRequest('B')">בקשה לאישור תמיכת גוף מסחרי
          במחקר קליני</button>
        <button mat-raised-button color="warn" class="cube" (click)="selectRequest('C')">בקשה לקיום הרצאה לסגל המרכז
          הרפואי</button>
      </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button mat-dialog-close>ביטול</button>
    </mat-dialog-actions>
  </div>
</ng-template>
