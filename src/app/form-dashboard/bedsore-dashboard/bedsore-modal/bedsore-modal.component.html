<button type="button" class="close" matTooltip="סגירה" aria-label="Close" (click)="closeModal()">
    <span aria-hidden="true">&times;</span>
</button>
<h1 mat-dialog-title style="text-align: center;">דו"ח פצע לחץ</h1>
<hr>
<div class="container" dir="rtl">
    <form class="form" [formGroup]="fullForm">
        <!-- DATE TIME -->
        <div class="row">
            <!-- DATE -->
            <div class="col-6 text-center">
                <mat-label>תאריך: </mat-label>
                <span><b>{{fullForm.get('DateOfForm').value}}</b></span>
            </div>
            <!-- TIME -->
            <div class="col-6 text-center">
                <mat-label>שעה: </mat-label>
                <span><b>{{fullForm.get('TimeOfForm').value}}</b></span>
            </div>
        </div>
        <hr>
        <!-- PERSONAL DETAILS -->
        <div class="row">
            <div class="col-3 text-center">
                <mat-label>ת.ז: </mat-label>
                <span><b>{{patientGroup.get('Passport').value}}</b></span>
            </div>
            <div class="col-3 text-center">
                <mat-label>מס' מקרה: </mat-label>
                <span><b>{{patientGroup.get('CaseNumber').value}}</b></span>
            </div>
            <div class="col-3 text-center">
                <mat-label>שם פרטי: </mat-label>
                <span><b>{{patientGroup.get('FirstName').value}}</b></span>
            </div>
            <div class="col-3 text-center">
                <mat-label>שם משפחה: </mat-label>
                <span><b>{{patientGroup.get('LastName').value}}</b></span>
            </div>
        </div>
        <hr>
        <!-- CONTENT INPUT -->
        <form [formGroup]="imageForm">
            <div formArrayName="ImagesList">
                <div *ngFor="let image of imagesList.controls; let i = index" [formGroupName]="i" class="row">
                    <!-- <div class="col-12 text-right">
                        <mat-label>העלאת קובץ</mat-label><br>
                        <input (change)="onImageFileChange($event.target.files, i)" #fileInput type="file"
                            id="file-{{i}}">
                        <img [src]="image.get('Content').value" height="100" width="100">
                    </div> -->
                    <br>
                    <!-- <div class="col-12">
                        <mat-form-field appearance="fill" style="margin: -12px;">
                            <mat-label style="align-self: center;">תאריך לקיחת בדיקה</mat-label>
                            <input matInput formControlName="ReceiveDate" [matDatepicker]="picker">
        
                            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                            <mat-datepicker #picker></mat-datepicker>
                        </mat-form-field>
                    </div> -->
                    <div class="col-12">
                        <mat-form-field class="example-full-width">
                            <mat-label>הערה</mat-label>
                            <input matInput placeholder="הערה" formControlName="Note">
                        </mat-form-field>
                    </div>
                </div>
            </div>
        </form>
        <!-- SAVE BUTTON -->
        <div class="row">
            <button class="full-width m-4" color="primary" style="font-size: 20px;font-weight: bold;" type="submit"
                mat-raised-button (click)="submitForm()">
                <span>שמירת טופס</span>
            </button>
        </div>
    </form>
</div>
