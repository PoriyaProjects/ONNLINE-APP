<div class="chart-controls">
  <mat-expansion-panel>
   <mat-expansion-panel-header>
   <mat-panel-title> פקדי שליטה </mat-panel-title>
   <mat-panel-description>
    לחץ להרחבה
   </mat-panel-description>
   </mat-expansion-panel-header>
   <p>
<span> 
 <!-- Show spinner while loading -->
 <div *ngIf="isLoadingDepartments">
 <p>טוען מחלקות... אנא המתן.</p>
 </div>
 
 <!-- Error message if failed -->
 <div *ngIf="departmentsLoadError && !isLoadingDepartments" class="error">
 <p>נכשלה טעינת המחלקות מהשרת. משתמש ברשימת גיבוי.</p>
 </div>
 
 <!-- Department select when ready -->
 <div *ngIf="!isLoadingDepartments" style="width: 260px; float:right; display: flex;">
 <select [(ngModel)]="selectedDeptGroupId" (ngModelChange)="onDeptGroupChange($event)" [disabled]="isLoadingDepartments" class="form-control" >
   <option [ngValue]="0">📊 בחר קבוצה</option>
   <option *ngFor="let dept of departments" [ngValue]="dept.id">  {{ dept.name }} </option>
</select>

 class="form-control"
>
</ng-select> -->
 </div>

</span>
    
   |<input type="date" [(ngModel)]="filters.startDate" (change)="onGlobalControlChange()" />
   <input type="date" [(ngModel)]="filters.endDate" (change)="onGlobalControlChange()" />
   | <label><input type="checkbox" [(ngModel)]="globalChartControls.showTrendline" (change)="onGlobalControlChange()" /> Trendline</label>
   | <label><input type="checkbox" [(ngModel)]="globalChartControls.showAnnotations" (change)="onGlobalControlChange()" /> Annotations</label>
   | <label><input type="checkbox" [(ngModel)]="globalChartControls.showLegend" (change)="onGlobalControlChange()" /> Legend</label>
   | <label><input type="checkbox" [(ngModel)]="globalChartControls.shortFormat" (change)="onGlobalControlChange()"> Short Format</label>
   | <label><input type="checkbox" [(ngModel)]="globalChartControls.showPercentageAnnotations" (change)="onGlobalControlChange()"> % Annotation</label>
   

   
   | 
   <label>
    תקופתיות:
    <select [(ngModel)]="filters.granularity" (change)="onGlobalControlChange()">
    <option *ngFor="let option of granularityOptions" [value]="option.value">
     {{ option.label }}
    </option>
    </select>
   </label>
   <br/>
   </p>
  </mat-expansion-panel>
  </div>
 </mat-toolbar>
