<fieldset>
  <legend>Global Chart Controls</legend>
  <label><input type="checkbox" [(ngModel)]="globalControls.showTrendline"> Trendline</label>
  | <label><input type="checkbox" [(ngModel)]="globalControls.showAnnotations"> Annotations</label>
  | <label><input type="checkbox" [(ngModel)]="globalControls.showLegend"> Legend</label>
  | <label><input type="checkbox" [(ngModel)]="globalControls.shortFormat"> Short Format</label>
  | <label><input type="checkbox" [(ngModel)]="globalControls.showPercentageAnnotations"> % Annotation</label>
  | <label><input type="checkbox" [(ngModel)]="globalControls.showHtmlTooltip"> HTML Tooltip</label>
</fieldset>

<div class="controls-bar">
<mat-form-field>
  <mat-label>בחר תקופה</mat-label>
  <mat-select [(ngModel)]="filters.param" (selectionChange)="onPeriodChange($event.value)">
    <mat-option *ngFor="let p of periods" [value]="p.id">{{ p.name }}</mat-option>
  </mat-select>
</mat-form-field>


<mat-form-field>
  <mat-label>בחר מחלקה</mat-label>
  <mat-select [(ngModel)]="filters.deptCode" (selectionChange)="onDepartmentChange($event.value)">
    <mat-option *ngFor="let d of departments" [value]="d.id">{{ d.name }}</mat-option>
  </mat-select>
</mat-form-field>
</div>
<app-controls-bar (filtersChanged)="updateFilters($event)" [departments]="departments" [periods]="periods" (filtersChanged)="updateFilters($event)"></app-controls-bar>

<section class="charts-section common-section">
  <h3> Common Metrics</h3>
  <div class="row">
  <app-total-revenue-line-chart [deptCode]="filters.deptCode" [param]="filters.param" class="col-lg-6"></app-total-revenue-line-chart>
  <app-total-revenue-bar-chart [deptCode]="filters.deptCode" [param]="filters.param" class="col-lg-6"></app-total-revenue-bar-chart>
  <!-- <app-total-revenue-column-chart [deptCode]="filters.deptCode" [param]="filters.param" class="col-lg-6"></app-total-revenue-column-chart> -->
  <app-total-revenue-column-chart
  [rawChartData]="rawChartData"
  [startDate]="filters.startDate"
  [endDate]="filters.endDate"
  [granularity]="filters.granularity"

  [showTrendline]="globalControls.showTrendline"
  [showAnnotations]="globalControls.showAnnotations"
  [showLegend]="globalControls.showLegend"
  [shortFormat]="globalControls.shortFormat"
  [showPercentageAnnotations]="globalControls.showPercentageAnnotations"
  [showHtmlTooltip]="globalControls.showHtmlTooltip"
></app-total-revenue-column-chart>

  <app-total-revenue-pie-chart class="col-lg-6"></app-total-revenue-pie-chart>
  <app-total-revenue-pie-chartex [deptCode]="filters.deptCode" [param]="filters.param" class="col-lg-6"></app-total-revenue-pie-chartex>
  <!-- <app-revenue-by-department-bar-chart [deptCode]="filters.deptCode" [param]="filters.param" class="col-lg-4"></app-revenue-by-department-bar-chart> -->
  <!-- <app-operating-expenses-line-chart [deptCode]="filters.deptCode" [param]="filters.param" class="col-lg-4"></app-operating-expenses-line-chart> -->
  </div>
</section>


<section class="charts-section operational-section">
  <h3> Operational Metrics</h3>
  <app-operations-gauge-chart [deptCode]="filters.deptCode" class="col-lg-4"></app-operations-gauge-chart>
  <app-operations-monthly-bar-chart [deptCode]="filters.deptCode" class="col-lg-4"></app-operations-monthly-bar-chart>
  <app-operations-line-trend [deptCode]="filters.deptCode" class="col-lg-4"></app-operations-line-trend>
</section>

<app-billing-errors-bar-chart [deptCode]="filters.deptCode" [param]="filters.param" class="col-lg-4"></app-billing-errors-bar-chart>
