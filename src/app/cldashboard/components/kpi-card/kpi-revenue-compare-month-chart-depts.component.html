<div class="google-chart-container mat-elevation-z22" style="padding: 12px; display:inline-block; margin:20px;">
  <mat-card style="text-align: center;">
    <mat-card-title>{{ chartTitle || 'Chart Placeholder' }}</mat-card-title>
    <mat-card-content>       
      <div style="text-align: center;margin-bottom: 10px;"><mat-spinner *ngIf="isLoading" style="margin:10px auto;"></mat-spinner></div>
      <div id="revenueCompareMonthsChartDepts" #revenueCompareMonthsChartDepts class="chart-render-area" style="width: 100%; height: 400px;"></div>    
    </mat-card-content>
  </mat-card>
</div>
