<div class="google-chart-container mat-elevation-z2" style="padding: 12px;">
  <mat-card style="text-align: center;">
    <mat-card-title>{{ chartTitle || 'Chart Placeholder' }}</mat-card-title>
    <mat-card-content>       
      <select [(ngModel)]="timePeriod" (change)="onTimePeriodChange()">
        <option *ngFor="let option of timePeriodOptions" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
      <!-- <button (click)="loadRevenueOverTime()">Apply Filter</button> -->
      <label>
        From:
        <input
          type="date"
          [(ngModel)]="startDate"
          [disabled]="timePeriod !== 'custom'" />
      </label>
    
      <label>
        To:
        <input
          type="date"
          [(ngModel)]="endDate"
          [disabled]="timePeriod !== 'custom'" />
      </label>
    
      <button mat-raised-button color="primary" (click)="applyFilters()">Apply Filter</button>
      <mat-spinner *ngIf="isLoading" style="margin:10px auto;"></mat-spinner>      
      <div *ngIf="!isLoading" #chart [id]="chartId"></div>
    </mat-card-content>
  </mat-card>
</div>
