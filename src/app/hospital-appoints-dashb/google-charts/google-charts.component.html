<style>
  #hmpcHost {
    min-height: 360px;
    display: block;
  }

  horizontal-multi-period-chart,
  app-horizontal-multi-period-chart {
    display: block;
    width: 100%;
    min-height: 340px;
  }

  .plot {
    width: 80vw;
    /* 80% of viewport width */
    margin: 0 auto;
    /* center horizontally */
    min-height: 320px;
    position: relative;
  }

  /* google-charts.component.css */
  .subtabs {
    display: flex;
    gap: 8px;
    padding: 8px 0 12px;
  }

  .subtab-btn {
    border: 1px solid #cfd8dc;
    background: #fff;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }

  .subtab-btn.active {
    border-color: #90caf9;
    background: #e3f2fd;
  }

  .chart-host>div {
    width: 100%;
    min-height: 260px;
    /* charts will set exact height on draw */
  }

  .tabs {
    margin-bottom: 15px;
  }

  .tabs button {
    padding: 10px 20px;
    margin-right: 5px;
    background: #f0f0f0;
    border: 1px solid #ccc;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s ease;
  }

  .tabs button:hover {
    background: #e6e6e6;
  }

  .tabs button.active {
    background: #6ba1f8;
    color: #fff;
    border-color: #6ba1f8;
    font-weight: bold;
  }
  
  .treemap-inline {
  word-wrap: break-word;
  overflow-wrap: break-word;
  hyphens: auto;
}

.treemap-overlay-layer {
  pointer-events: none !important;
}

/* Ensure Google Charts text doesn't interfere */
.google-visualization-treeMap-node text {
  font-weight: bold !important;
  text-shadow: 0 0 2px rgba(255,255,255,0.9) !important;
}

</style>


<div class="mdc-layout-grid" style="direction: rtl;">
  <div class="row" style="text-align: center;">
    <!-- <div class="mdc-layout-grid__cell col-md-12"> -->
    <h1 class="page-title text-center" style="text-align: center;">
      תורים — דאשבורד הנהלה
    </h1>
    <!-- </div> -->

    <div class="mdc-layout-grid__cell col-md-12">
      <!-- <div>
          <button (click)="refreshData()" class="btn btn-light" [disabled]="loading" title="רענון נתונים">
            רענן
          </button>
        </div> -->
      <div class="row" style="width: 100%; text-align: center;">
        <!-- <div
          style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 12px; width: 100%;"> -->
          <!-- Loading / Error -->
          <div *ngIf="loading" style="padding:24px">טוען נתונים...</div>
          <div *ngIf="!loading && error" style="padding:24px; color:#b71c1c">{{ error }}</div>

          <ng-container *ngIf="!loading && !error">
            <!-- Tabs -->
            <div class="row" style="width:100%">
              <div class="tabs" style="text-align:right; margin: 12px 0;">
                <button (click)="onApptTabChange('treemap')" [class.active]="activeApptTab==='treemap'">מפת עומסים
                  (Treemap)</button>

                <button (click)="onApptTabChange('leaders')" [class.active]="activeApptTab==='leaders'">ליגת רופאים
                </button>

              </div>
            </div>
            <!-- Treemap -->
            <div *ngIf="activeApptTab==='treemap'" style="position:relative;" class="row" style="width:100%">
              <div class="mdc-layout-grid__cell col-md-12">
                <div class="card text-center" style="margin: 10px 0 24px; direction: rtl;">
                  <div id="apptTreemap" style="width: 100%; height: 600px;">טוען...</div>

                  <!-- Optional custom-SVG SLA legend -->
                  <svg width="210" height="60"
                    style="position:absolute; top:8px; left:8px; background:white; border:1px solid #ccc; border-radius:4px">
                    <text x="8" y="16" font-size="12">SLA (ימים):</text>
                    <rect x="8" y="24" width="24" height="12" fill="#e8f5e9"></rect><text x="36" y="34"
                      font-size="11">≤14</text>
                    <rect x="72" y="24" width="24" height="12" fill="#fff9c4"></rect><text x="100" y="34"
                      font-size="11">15–30</text>
                    <rect x="136" y="24" width="24" height="12" fill="#ffebee"></rect><text x="164" y="34"
                      font-size="11">>30</text>
                  </svg>
                </div>
              </div>
            </div>



            <!-- Leaderboards -->
            <!-- Leaders tab pane -->
            <div *ngIf="activeApptTab === 'leaders'" class="leaders-pane" class="row" style="width:100%;">
              <div class="mdc-layout-grid__cell col-md-12">
                
              <div class="card text-center" style="margin: 10px 0 24px; direction: rtl;">
                <div class="row" style="margin: 20px 40px 0px;">
                <div class="subtabs">
                  <button class="subtab-btn" [class.active]="leaderSubTab === 'doctors'"
                    (click)="onLeaderSubTabChange('doctors')">
                    רופאים
                  </button>
                  <button class="subtab-btn" [class.active]="leaderSubTab === 'departments'"
                    (click)="onLeaderSubTabChange('departments')">
                    מחלקות
                  </button>
                </div>
                </div>

                <!-- One visible container at a time -->
                <div *ngIf="leaderSubTab === 'doctors'" class="chart-host">
                  <div id="apptLeadersDoctors"></div>
                </div>

                <div *ngIf="leaderSubTab === 'departments'" class="chart-host">
                  <div id="apptLeadersDepts"></div>
                </div>
              </div>
              </div>
            </div>



          </ng-container>
          <div style="height:60px;"></div>


        <!-- </div> -->
      </div>
    </div>
  </div>
</div>
