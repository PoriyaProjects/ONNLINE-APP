<div id="page-toshow">
    <h1 class="page-title text-center">ניהול ספקים</h1>

    <div class="container-fluid pb-60" dir="rtl">
        <div class="row">
            <div class="col-9">
                <mat-form-field>
                    <mat-label>חפש</mat-label>
                    <input matInput placeholder="חפש" [(ngModel)]="FreeText" />
                </mat-form-field>
            </div>
            <div class="col-3">
                <mat-form-field>
                    <mat-label>מצב</mat-label>
                    <mat-select [(ngModel)]="Status">
                        <mat-option *ngFor="let ab of StatusListSearch" [value]="ab.id"> {{ab.value}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
        <div class="row text-left" dir="ltr">
            <div class="col-4">
                <button mat-flat-button (click)="applyFilter()" color="primary" type="button">חפש</button> &nbsp; &nbsp; &nbsp;
                <button mat-raised-button color="" (click)="exportToExcel()">
                    <img src="../../assets/images/excel.png" width="35px" alt="Image description" >
                </button>
            </div>
            
        </div>
        <br>
        <hr>
        <br>
        <div class="row">
            <div class="col">
                <div class="table-responsive">
                    <div class="table-spinner-container">
                        <!-- <mat-form-field>
                                <input matInput (keyup)="applyFilter($event.target.value)" placeholder="חפש">
                            </mat-form-field> -->
                        <table class="table" mat-table class="text-right w-100" [dataSource]="dataSource" matSort>
                            <ng-container matColumnDef="RowID">
                                <th mat-header-cell *matHeaderCellDef>מס'</th>
                                <td mat-cell *matCellDef="let element">
                                    {{ element.RowID }}
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="SupplierName">
                                <th mat-header-cell *matHeaderCellDef>
                                    שם ספק
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    {{ element.SupplierName }}
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="ServerDescription">
                                <th mat-header-cell *matHeaderCellDef>תאור השרות/מוצר</th>
                                <td mat-cell *matCellDef="let element">
                                    {{ element.ServerDescription }}
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="ContactName">
                                <th mat-header-cell *matHeaderCellDef>
                                    שם איש קשר
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    {{ element.ContactName }}
                                </td>
                            </ng-container>

                            <ng-container matColumnDef="ContactEmail">
                                <th mat-header-cell *matHeaderCellDef>
                                    כתובת אימייל
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    {{element.ContactEmail}}
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="ContactTell">
                                <th mat-header-cell *matHeaderCellDef>
                                    מס' טלפון / נייד
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    {{element.ContactTell}}
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="RowStatus">
                                <th mat-header-cell *matHeaderCellDef>
                                    מצב
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    <span *ngIf="element.RowStatus == 1">פעיל</span>
                                    <span *ngIf="element.RowStatus == 0">לא פעיל</span>


                                </td>
                            </ng-container>
                            <ng-container matColumnDef="editAuthorized">
                                <th mat-header-cell *matHeaderCellDef width="50">
                                    עריכה
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    <div class="example-button-container">
                                        <button (click)="editRow(element)" class="row-data" mat-mini-fab
                                            color="primary">
                                            <mat-icon>create</mat-icon>
                                        </button>
                                    </div>
                                </td>
                            </ng-container>

                            <ng-container matColumnDef="deleteServer">
                                <th mat-header-cell *matHeaderCellDef width="50">
                                    Delete
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    <div class="example-button-container">
                                        <button (click)="deleteRow(element)" class="row-data" mat-mini-fab
                                            color="primary">
                                            <mat-icon>delete</mat-icon>
                                        </button>
                                    </div>
                                </td>
                            </ng-container>
                            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                        </table>
                    </div>
                    <!-- PAGINATION -->
                    <mat-paginator [length]="resultsLength" [pageSizeOptions]="[5, 10, 20, 50, 100]" [pageSize]="15"
                        showFirstLastButtons></mat-paginator>
                </div>
            </div>
        </div>
    </div>
</div>

<button type="button" id="GroupBtn" (click)="open()" mat-fab color="primary">
    <i class="material-icons">add</i>
</button>
