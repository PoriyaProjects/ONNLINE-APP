<div id="page-toshow">
    <h1 class="page-title text-center">ניהול ספקים</h1>

    <div class="container-fluid pb-60" dir="rtl">
        <div class="row">
            <div  class="col">
                <mat-form-field>
                    <mat-label>חפש</mat-label>
                    <input
                        matInput
                        (keyup)="applyFilter($event)"
                        placeholder="חפש"
                        #input
                    />
                </mat-form-field>
                <div class="table-responsive">
                    <div class="table-spinner-container">
                        <!-- <mat-form-field>
                                <input matInput (keyup)="applyFilter($event.target.value)" placeholder="חפש">
                            </mat-form-field> -->
                        <table
                            class="table"
                            mat-table
                            class="text-right w-100"
                            [dataSource]="dataSource"
                            matSort
                        >
                            <ng-container matColumnDef="RowID">
                                <th mat-header-cell *matHeaderCellDef>מס'</th>
                                <td mat-cell *matCellDef="let element">
                                    {{ element.RowID }}
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="SupplierName">
                                <th mat-header-cell *matHeaderCellDef>
                                    שם ספק
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    {{ element.SupplierName }}
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="ServerDescription">
                                <th mat-header-cell *matHeaderCellDef>תאור השרות/מוצר</th>
                                <td mat-cell *matCellDef="let element">
                                    {{ element.ServerDescription }}
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="ContactName">
                                <th mat-header-cell *matHeaderCellDef>
                                    שם איש קשר
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    {{ element.ContactName }}
                                </td>
                            </ng-container>

                            <ng-container matColumnDef="ContactEmail">
                                <th mat-header-cell *matHeaderCellDef>
                                    כתובת אימייל
                                </th>
                                <td mat-cell *matCellDef="let element">
                                {{element.ContactEmail}}
                                </td>
                            </ng-container> 
                            <ng-container matColumnDef="ContactTell">
                                <th mat-header-cell *matHeaderCellDef>
                                    מס' טלפון / נייד
                                </th>
                                <td mat-cell *matCellDef="let element">
                                {{element.ContactTell}}
                                </td>
                            </ng-container> 
                            
                            <ng-container matColumnDef="editAuthorized">
                                <th
                                    mat-header-cell
                                    *matHeaderCellDef
                                    width="50"
                                >
                                    עריכה
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    <div class="example-button-container">
                                        <button
                                            (click)="editRow(element)"
                                            class="row-data"
                                            mat-mini-fab
                                            color="primary"
                                        >
                                            <mat-icon>create</mat-icon>
                                        </button>
                                    </div>
                                </td>
                            </ng-container>

                            <ng-container matColumnDef="deleteServer">
                                <th
                                    mat-header-cell
                                    *matHeaderCellDef
                                    width="50"
                                >
                                    Delete
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    <div class="example-button-container">
                                        <button
                                            (click)="deleteRow(element)"
                                            class="row-data"
                                            mat-mini-fab
                                            color="primary"
                                        >
                                            <mat-icon>delete</mat-icon>
                                        </button>
                                    </div>
                                </td>
                            </ng-container>
                            <tr
                                mat-header-row
                                *matHeaderRowDef="displayedColumns"
                            ></tr>
                            <tr
                                mat-row
                                *matRowDef="let row; columns: displayedColumns"
                            ></tr>
                        </table>
                    </div>
                    <!-- PAGINATION -->
                    <mat-paginator
                        [length]="resultsLength"
                        [pageSizeOptions]="[5, 10, 20, 50, 100]"
                        [pageSize]="15"
                        showFirstLastButtons
                    ></mat-paginator>
                </div>
            </div>
        </div>
    </div>
</div>

<button type="button" id="GroupBtn" (click)="open()" mat-fab color="primary">
    <i class="material-icons">add</i>
</button>
