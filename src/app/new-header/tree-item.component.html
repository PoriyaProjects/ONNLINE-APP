<li *ngFor="let link of data" class="nav-item modern-list-item">
    <!-- Internal links -->
    <a *ngIf="link.Children.length == 0 && link.LinkId.indexOf('http') == -1" class="nav-link modern-link"
        [routerLink]="link.LinkId">{{ link.LinkDescription }}
        <!-- Clickable info button -->
        <button mat-icon-button class="info-button" color="primary"
            (click)="linkSubject(link) && (username == 'adahabre' || username == 'malkobi')"
            matTooltip="{{link.LinkSubject}}">
            <mat-icon>info</mat-icon>
        </button>
    </a>

    <!-- External links -->
    <a *ngIf="link.LinkId.indexOf('http') != -1" class="nav-link modern-link" target="_blank" [href]="link.LinkId">
        {{ link.LinkDescription }}
        <!-- Clickable info button -->
        <button mat-icon-button class="info-button" color="primary" (click)="linkSubject(link)"
            matTooltip="{{link.LinkSubject}}">
            <mat-icon>info</mat-icon>
        </button>
    </a>

    <!-- Nested Children links with Accordion -->
    <span *ngIf="link.Children && link.Children.length > 0" class="accordion-container">
        <mat-accordion class="child-accordion">
            <mat-expansion-panel>
                <mat-expansion-panel-header>
                    <mat-panel-title>
                        {{ link.LinkDescription }}
                    </mat-panel-title>
                </mat-expansion-panel-header>
                <ul>
                    <li *ngFor="let child of link.Children">
                        <a class="child-link" [routerLink]="child.LinkId">{{ child.LinkDescription }}</a>
                    </li>
                </ul>
            </mat-expansion-panel>
        </mat-accordion>
    </span>
</li>

<ng-template #modalLinkSubject let-close="close" dir="rtl">
    <button type="button" class="close" matTooltip="סגירה" aria-label="Close" (click)="closeModal()">
        <span aria-hidden="true">&times;</span>
    </button>

    <h1 mat-dialog-title style="text-align: center;">תיאור פרויקט</h1>
    <hr>
    <form mat-dialog-content dir="rtl" style="text-align: right;">
        <div class="example-full-width">
            <mat-form-field>
                <textarea rows="5" matInput [(ngModel)]="subject" [ngModelOptions]="{standalone: true}"></textarea>
            </mat-form-field>
        </div>
    </form>
    <button mat-raised-button class="btn btn-primary btn-raised" color="primary" (click)="saveLinkSubject()"
        matTooltip="שמירה">
        <mat-icon>save</mat-icon>
    </button>
</ng-template>
