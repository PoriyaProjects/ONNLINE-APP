<li *ngFor="let link of data" class="nav-item">
    <a *ngIf="link.Children.length == 0 && link.LinkId.indexOf('http') == -1" class="child-link"
        [routerLink]="link.LinkId">{{ link.LinkDescription }}
        <button mat-icon-button class="info-button" color="primary" (click)="canEdit && linkSubject(link)"
            matTooltip="{{link.LinkSubject}}">
            <mat-icon>info</mat-icon>
        </button>
    </a>

    <a *ngIf="link.LinkId.indexOf('http') != -1" class="child-link" target="_blank" [href]="link.LinkId">
        {{ link.LinkDescription }}
        <button mat-icon-button class="info-button" color="primary" (click)="canEdit && linkSubject(link)"
            matTooltip="{{link.LinkSubject}}">
            <mat-icon>info</mat-icon>
        </button>
    </a>

    <span *ngIf="link.Children && link.Children.length > 0" class="accordion-container">
        <mat-accordion class="child-accordion">
            <mat-expansion-panel>
                <mat-expansion-panel-header>
                    <mat-panel-title>
                        {{ link.LinkDescription }}
                    </mat-panel-title>
                </mat-expansion-panel-header>
                <ul>
                    <tree-item [data]="link.Children"></tree-item>
                    <!-- <li *ngFor="let child of link.Children">
                        <a class="child-link" [routerLink]="child.LinkId">
                            {{ child.LinkDescription }}
                            <button mat-icon-button class="info-button" color="primary" (click)="linkSubject(child)"
                                matTooltip="{{child.LinkSubject}}">
                                <mat-icon>info</mat-icon>
                            </button></a>
                    </li> -->
                </ul>
            </mat-expansion-panel>
        </mat-accordion>
    </span>
</li>

<!-- error in the tempalte html -->
<ng-template #modalLinkSubject let-close="close" dir="rtl">
    <button type="button" class="close" matTooltip="סגירה" aria-label="Close" (click)="closeModal()">
        <span aria-hidden="true">&times;</span>
    </button>

    <h1 mat-dialog-title style="text-align: center;">תיאור פרויקט</h1>
    <hr>
    <form dir="rtl" style="text-align: right;">
        <div class="example-full-width">
            <mat-form-field>
                <textarea rows="5" matInput [(ngModel)]="subject" [ngModelOptions]="{standalone: true}"></textarea>
            </mat-form-field>
        </div>
    </form>
    <button mat-raised-button class="btn btn-primary btn-raised" color="primary" (click)="saveLinkSubject()"
        matTooltip="שמירה">
        <mat-icon>save</mat-icon>
    </button>
</ng-template>
