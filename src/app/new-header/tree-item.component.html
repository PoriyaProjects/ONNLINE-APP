<li *ngFor="let link of data" class="nav-item">
    <a *ngIf="link.Children.length == 0 && link.LinkId.indexOf('http') == -1 " class="nav-link"
        [routerLink]="link.LinkId">{{ link.LinkDescription }}
        <button type="button" mat-icon-button class="pin-button" [class.pin-button--on]="isPinned(link)"
            (click)="onPinClick($event, link)"
            [matTooltip]="isPinned(link) ? 'הסר נעיצה מהתפריט' : 'נעץ בראש התפריט'">
            <mat-icon>push_pin</mat-icon>
        </button>
        <button mat-icon-button class="info-button" color="primary"
            (click)="linkSubject(link)" matTooltip="תיאור לינק">
            <mat-icon>info</mat-icon>
        </button></a>
    <a *ngIf="link.LinkId.indexOf('http') != -1 " class="nav-link" target="_blank" [href]="link.LinkId">{{
        link.LinkDescription }}
        <button type="button" mat-icon-button class="pin-button" [class.pin-button--on]="isPinned(link)"
            (click)="onPinClick($event, link)"
            [matTooltip]="isPinned(link) ? 'הסר נעיצה מהתפריט' : 'נעץ בראש התפריט'">
            <mat-icon>push_pin</mat-icon>
        </button>
        <button mat-icon-button class="info-button" color="primary" (click)="linkSubject(link)"
            matTooltip="תיאור לינק">
            <mat-icon>info</mat-icon>
        </button></a>
    <span *ngIf="link.Children && link.Children.length > 0">
        <mat-accordion>
            <mat-expansion-panel>
                <mat-expansion-panel-header>
                    <mat-panel-title class="menu-panel-title">
                        <span>{{ link.LinkDescription }}</span>
                        <button type="button" mat-icon-button class="pin-button"
                            [class.pin-button--on]="isPinned(link)"
                            (click)="onPinClick($event, link)"
                            [matTooltip]="isPinned(link) ? 'הסר נעיצה מהתפריט' : 'נעץ בראש התפריט'">
                            <mat-icon>push_pin</mat-icon>
                        </button>
                    </mat-panel-title>
                    <mat-panel-description> </mat-panel-description>
                </mat-expansion-panel-header>
                <ul>
                    <tree-item [data]="link.Children" [pinnedIds]="pinnedIds"
                        (togglePin)="togglePin.emit($event)"></tree-item>
                </ul>
            </mat-expansion-panel>
        </mat-accordion>
    </span>
</li>
