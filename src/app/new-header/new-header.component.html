<nav dir="rtl" class="navbar navbar-expand-lg navbar-light bg-primary">
    <button class="btn bmd-btn-icon" type="button" id="menu-btn">
        <i class="material-icons closeMe"> close </i>
        <i class="material-icons open"> menu </i>
    </button>

    <div dir="rtl" class="text-right sidebar" id="app-menu">

        <!-- Loading Spinner -->
        <mat-spinner *ngIf="headerLoad" diameter="30"></mat-spinner>

        <!-- Sidebar Links -->
        <ul class="navbar-nav mr-auto">
            <li class="pinned-menu-label" *ngIf="pinnedLinks.length">
                <mat-icon>push_pin</mat-icon>
                <span>נעוצים</span>
            </li>
            <tree-item *ngIf="pinnedLinks.length" [data]="pinnedLinks" [pinnedIds]="pinnedIds"
                (togglePin)="togglePin($event)"></tree-item>
            <li class="pinned-menu-end" *ngIf="pinnedLinks.length"></li>
            <tree-item [data]="filteredLinks" [pinnedIds]="pinnedIds"
                (togglePin)="togglePin($event)"></tree-item>
            <li class="nav-item">
                <button class="full-width clearCach" mat-raised-button (click)="logout($event)">
                    Logout
                </button>
            </li>
        </ul>
    </div>
    <div id="logo" routerLink="dashboard">
        <img alt="צפון" src="assets/images/logo.png" />
    </div>
</nav>
