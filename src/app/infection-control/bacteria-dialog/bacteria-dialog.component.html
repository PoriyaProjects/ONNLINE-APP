<h2 mat-dialog-title>{{ isEdit ? 'Edit Bacteria' : 'Add Bacteria' }}</h2>
<mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Description</mat-label>
    <input matInput [(ngModel)]="mdroDesc" required placeholder="Bacteria (MDRO) description">
  </mat-form-field>
  <div *ngIf="!isEdit" class="toggle-row">
    <mat-slide-toggle [(ngModel)]="isActive">Active</mat-slide-toggle>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" [disabled]="saving || !mdroDesc?.trim()" (click)="save()">
    {{ saving ? 'Saving...' : 'Save' }}
  </button>
</mat-dialog-actions>
