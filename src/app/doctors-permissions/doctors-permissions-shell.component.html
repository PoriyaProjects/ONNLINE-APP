<div class="dp-app" dir="rtl">
  <aside class="dp-side">
    <div class="dp-brand">
      <div class="dp-brand__mark"><i class="material-icons" aria-hidden="true">local_hospital</i></div>
      <div>
        <strong>הרשאות רופאים</strong>
        <span>{{ access?.displayName || 'טוען...' }}</span>
      </div>
    </div>
    <nav class="dp-nav">
      <a *ngFor="let item of nav" [hidden]="!visible(item)" [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: !!item.exact }">
        <i class="dp-nav__icon material-icons" aria-hidden="true">{{ item.icon }}</i>
        <span>{{ item.label }}</span>
      </a>
    </nav>
  </aside>
  <main class="dp-main">
    <div class="dp-error" *ngIf="error">{{ error }}</div>
    <router-outlet></router-outlet>
  </main>
</div>
