    <!-- Section 3: Table -->
    <section class="table-section">
        <h2>לומדות שנותרו לביצוע</h2>
        <hr>
        <mat-card>
            <table mat-table [dataSource]="tableData" class="mat-elevation-z8">
                <ng-container matColumnDef="assignment_id">
                    <th mat-header-cell *matHeaderCellDef>מזהה לומדה</th>
                    <td mat-cell *matCellDef="let element">{{ element.assignment_id }}</td>
                </ng-container>

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>שם הלומדה</th>
                    <td mat-cell *matCellDef="let element">{{ element.name }}</td>
                </ng-container>

                <ng-container matColumnDef="due_date">
                    <th mat-header-cell *matHeaderCellDef>תאריך אחרון לביצוע</th>
                    <td mat-cell *matCellDef="let element">{{ element.due_date }}</td>
                </ng-container>

                <ng-container matColumnDef="link">
                    <th mat-header-cell *matHeaderCellDef>לינק לביצוע לומדה</th>
                    <td mat-cell *matCellDef="let element"><span class="clickable-text"
                            (click)="openLink(element.external_id)">
                            לחץ כאן לביצוע הלומדה
                        </span>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>
        </mat-card>
    </section>
</div>
