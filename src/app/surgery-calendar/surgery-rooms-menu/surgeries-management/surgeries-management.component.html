<mat-spinner *ngIf="loader && !backgroundRefreshing"></mat-spinner>
<div class="row head" dir="rtl">
  <button mat-mini-fab aria-label="close icon" (click)="closeDialog()" class="close-btn">
    X
  </button>
  <div class="col-md-3">
    <div class="btn-group">
      <div class="btn btn-primary nav-btn" mwlCalendarPreviousView [view]="view"
        [(viewDate)]="viewDate" (viewDateChange)="closeOpenDayViewDay()">
        הקודם
      </div>
      <div class="btn btn-outline-secondary nav-btn" mwlCalendarToday
        [(viewDate)]="viewDate" (viewDateChange)="closeOpenDayViewDay()">
        היום
      </div>
      <div class="btn btn-primary nav-btn" mwlCalendarNextView [view]="view"
        [(viewDate)]="viewDate" (viewDateChange)="closeOpenDayViewDay()">
        הבא
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="refresh-toolbar">
      <button mat-raised-button class="refresh-btn" (click)="getPatientsQueues()" matTooltip="טעינת נתונים"
        [disabled]="loadingDataServer || loader || backgroundRefreshing">
        <h3 *ngIf="!loadingDataServer && !loader && !backgroundRefreshing">{{ viewDate | calendarDate:(view + 'ViewTitle'):'he'
          }}<mat-icon>refresh</mat-icon>
        </h3>
        <h3 *ngIf="loadingDataServer || loader || backgroundRefreshing">טוען נתונים</h3>
      </button>
      <div class="refresh-status" *ngIf="backgroundRefreshing">
        <mat-spinner diameter="18"></mat-spinner>
        <span>מעדכן נתונים ברקע...</span>
      </div>
      <div class="mode-buttons">
        <button *ngIf="!isPhysicalRoom" mat-raised-button (click)="getPatientsQueues()"
          [class.mode-btn--active]="IfPlannedSurgeries == 'original'">מקור</button>
        <button *ngIf="IfPlannedSurgeries != 'dror'" mat-raised-button (click)="sortSurgeriesOfEachRoomInDay()"
          [class.mode-btn--active]="IfPlannedSurgeries == 'planned'">תכנון</button>
      </div>
      <mat-spinner *ngIf="loadingDataServer" diameter="24"></mat-spinner>
    </div>
  </div>
  <div class="col-md-3">
    <ul class="list legend-list">
      <li class="legend legend--urgent"><b>דחוף</b></li>
      <li class="legend legend--sesia"><b>ססיה</b></li>
      <li class="legend legend--completed"><b>הושלם</b></li>
      <li class="legend legend--in-progress"><b>בתהליך</b></li>
      <li class="legend legend--planned"><b>מתוכנן</b></li>
      <li class="legend legend--canceled"><b>בוטל</b></li>
    </ul>
  </div>
</div>
<div class="container-fluid surgeries-board" [class.surgeries-board--refreshing]="backgroundRefreshing" dir="rtl">
  <div class="surgeries-board__rooms">
    <div class="rooms-grid" [style.--room-count]="expectedRoomCount">
      <div class="room-column" *ngFor="let room of filteredSpecificRooms">
        <div class="room-card" [class.room-card--danger]="room.surgerySurf">
        <div class="room-card__sticky-top">
          <div class="room-card__header">
            <button mat-button [matMenuTriggerFor]="roomMenu" class="rooms-btn"
              [class.rooms-btn-danger]="room.surgerySurf">
              {{room.roomName}}
            </button>
            <mat-menu #roomMenu="matMenu">
              <button mat-menu-item (click)="showSummaryReport(room)"><b>סיכום חדר</b></button>
              <button mat-menu-item (click)="filterDepartment(depart)"
                *ngFor="let depart of room.uniqueDepartments">{{depart}}
                <div class="example-button-container" *ngIf="depart != null">
                  <a (click)="getPlannedSurgeriesData(depart, room.roomName)">
                    <img src="../../assets/images/excel.png" alt="Excel File" matTooltip="יצירת קובץ אקסל {{depart}}">
                  </a>
                  <a (click)="sentDepartmentFinalSurgeryPlan(depart, room.roomName)">
                    <img src="../../assets/images/transferTo.png" alt="Send Final Plan"
                      matTooltip="שליחת תוכנית סופית {{depart}}">
                  </a>
                </div>
              </button>
              <button mat-menu-item>כלל המחלקות
                <div class="example-button-container">
                  <a (click)="getPlannedSurgeriesData(room.uniqueDepartments, room.roomName)">
                    <img src="../../assets/images/excel.png" alt="Excel File" matTooltip="יצירת קובץ אקסל ">
                  </a>
                  <a (click)="sentDepartmentFinalSurgeryPlan(room.uniqueDepartments, room.roomName)">
                    <img src="../../assets/images/transferTo.png" alt="Send Final Plan" matTooltip="שליחת תוכנית סופית ">
                  </a>
                </div>
              </button>
            </mat-menu>
          </div>

          <div *ngIf="loadingRoomPrices" class="room-price-summary room-price-summary--loading">
            טוען מחירים...
          </div>
          <div *ngIf="!loadingRoomPrices && getRoomPriceSummary(room) as priceSummary" class="room-price-summary">
            <div class="room-price-summary__item">
              <span class="room-price-summary__label">סה״כ הכנסה לחדר ביום</span>
              <span class="room-price-summary__value">{{ priceSummary.total }} ₪</span>
            </div>
            <div *ngIf="priceSummary.departmentDailyAverage" class="room-price-summary__item room-price-summary__item--average">
              <span class="room-price-summary__label">הכנסה ממוצעת ליום למחלקה לתקופה של 6 חודשים אחרונים, בתנאי שהחדר לא מפוצל</span>
              <span class="room-price-summary__value">{{ priceSummary.departmentDailyAverage }} ₪</span>
            </div>
          </div>
        </div>

        <div class="room-card__calendar" #roomCalendarScroll [ngSwitch]="view">
          <mwl-calendar-day-view *ngSwitchCase="CalendarView.Day" [viewDate]="viewDate" [events]="room.Surgeries"
            [locale]="locale" [refresh]="refresh" [dayStartHour]="dayViewStartHour" [dayEndHour]="dayViewEndHour"
            [hourSegmentHeight]="hourSegmentHeight" [hourSegments]="hourSegments"
            (eventClicked)="handleEvent('Edit', $event.event)"
            (eventTimesChanged)="eventTimesChanged($event)">
          </mwl-calendar-day-view>
        </div>
      </div>
    </div>
  </div>
  </div>
</div>
