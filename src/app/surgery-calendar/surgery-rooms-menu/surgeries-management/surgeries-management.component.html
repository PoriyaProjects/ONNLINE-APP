<mat-spinner *ngIf="loader"></mat-spinner>
<div class="row head" dir="rtl">
  <!--  style="float: right;" -->
  <button mat-mini-fab aria-label="close icon" (click)="closeDialog()">
    X
  </button>
  <div class="col-md-3">
    <div class="btn-group">
      <div class="btn btn-primary" style="border-radius: 5px;margin: 1px" mwlCalendarPreviousView [view]="view"
        [(viewDate)]="viewDate" (viewDateChange)="closeOpenDayViewDay()">
        הקודם
      </div>
      <div class="btn btn-outline-secondary" style="border-radius: 5px;margin: 1px" mwlCalendarToday
        [(viewDate)]="viewDate" (viewDateChange)="closeOpenDayViewDay()">
        היום
      </div>
      <div class="btn btn-primary" style="border-radius: 5px;margin: 1px" mwlCalendarNextView [view]="view"
        [(viewDate)]="viewDate" (viewDateChange)="closeOpenDayViewDay()">
        הבא
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="mb-2">
      <button mat-raised-button (click)="surgeriesRefreshDataInServer()" matTooltip="טעינת נתונים"
        [disabled]="loadingDataServer || loader">
        <h3 *ngIf="!loadingDataServer && !loader">{{ viewDate | calendarDate:(view + 'ViewTitle'):'he'
          }}<mat-icon>refresh</mat-icon></h3>
        <h3 *ngIf="loadingDataServer || loader">טוען נתונים</h3>
      </button>
    </div>
    <div class="mt-2">
      <button mat-raised-button (click)="getPatientsQueues()"
        [ngStyle]="{'background-color': IfPlannedSurgeries == 'original' ? 'cornflowerblue' : '' }">מקור</button>
      <button *ngIf="IfPlannedSurgeries != 'dror'" mat-raised-button (click)="sortSurgeriesOfEachRoomInDay()"
        [ngStyle]="{'background-color': IfPlannedSurgeries == 'planned' ? 'cornflowerblue' : '' }">תכנון</button>
      <button *ngIf="IfPlannedSurgeries != 'planned'" mat-raised-button (click)="plannedFromDrorSystem()"
        [ngStyle]="{'background-color': IfPlannedSurgeries == 'dror' ? 'cornflowerblue' : '' }">דרור</button>
    </div>
    <mat-spinner *ngIf="loadingDataServer"></mat-spinner>
  </div>
  <div class="col-md-3">
    <ul class="list">
      <li style="background-color: #F1F305;font-size: 22px;"><b>דחוף</b></li>
      <li style="background-color: #FFA100;font-size: 22px;"><b>ססיה</b></li>
      <li style="background-color: #0ef12f;font-size: 22px;"><b>הושלם</b></li>
      <li style="background-color: #e8abf1;font-size: 22px;"><b>בתהליך</b></li>
      <li style="background-color: #abeff1;font-size: 22px;"><b>מתוכנן</b></li>
      <li style="background-color: #f10e0e;font-size: 22px;"><b>בוטל</b></li>
    </ul>
  </div>
</div>
<div class="container-fluid pb-5" dir="rtl">
  <div class="row" style="margin-top: 60px;">
    <div class="col text-center" *ngFor="let room of filteredSpecificRooms">
      <!-- <button mat-raised-button class="rooms-btn" (click)="showSummaryReport(room)"
        *ngIf="!room.surgerySurf">{{room.SurgeryRoom}}</button>
      <button mat-raised-button class="rooms-btn-danger" (click)="showSummaryReport(room)" *ngIf="room.surgerySurf"
        matTooltip="ניתוחים חורגים בזמן">{{room.SurgeryRoom}}</button> -->
      <div *ngIf="!room.surgerySurf">
        <button mat-button [matMenuTriggerFor]="menu" class="rooms-btn">{{room.SurgeryRoom}}</button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="showSummaryReport(room)"><b>סיכום חדר</b></button>
          <button mat-menu-item (click)="filterDepartment(depart)"
            *ngFor="let depart of room.uniqueDepartments">{{depart}}
            <div class="example-button-container" *ngIf="depart != null">
              <a (click)="getPlannedSurgeriesData(depart)">
                <img src="../../assets/images/excel.png" alt="Excel File" matTooltip="יצירת קובץ אקסל {{depart}}">
              </a>
              <a (click)="sentDepartmentFinalSurgeryPlan(depart)">
                <img src="../../assets/images/transferTo.png" alt="Send Final Plan"
                  matTooltip="שליחת תוכנית סופית {{depart}}">
              </a>
            </div>
          </button>
        </mat-menu>
      </div>
      <div *ngIf="room.surgerySurf">
        <button mat-button [matMenuTriggerFor]="menu" class="rooms-btn-danger">{{room.SurgeryRoom}}</button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="showSummaryReport(room)"><b>סיכום חדר</b></button>
          <button mat-menu-item (click)="filterDepartment(depart)"
            *ngFor="let depart of room.uniqueDepartments">{{depart}}
            <div class="example-button-container" *ngIf="depart != null">
              <a (click)="getPlannedSurgeriesData(depart)">
                <img src="../../assets/images/excel.png" alt="Excel File">
              </a>
              <a (click)="sentDepartmentFinalSurgeryPlan(depart)">
                <img src="../../assets/images/transferTo.png" alt="Send Final Plan"
                  matTooltip="שליחת תוכנית סופית {{depart}}">
              </a>
            </div>
          </button>
        </mat-menu>
      </div>

      <div [ngSwitch]="view">
        <!--  [dayStartHour]="06"  [dayEndHour]="23" -->
        <mwl-calendar-day-view *ngSwitchCase="CalendarView.Day" [viewDate]="viewDate" [events]="room.Surgeries"
          [locale]="locale" [refresh]="refresh" (eventClicked)="handleEvent('Edit', $event.event)"
          (eventTimesChanged)="eventTimesChanged($event)">
        </mwl-calendar-day-view>
      </div>
    </div>
  </div>
</div>
