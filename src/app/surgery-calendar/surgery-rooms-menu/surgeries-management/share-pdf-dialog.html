<mat-card dir="rtl" class="full-width text-center pb-0 mb-3">
    <h2>שליחת דוחות לנמענים</h2>
    <div class="row">
        <!-- <div class="col-9"> -->
        <form class="example-form">
            <mat-form-field class="example-full-width">
                <mat-label>בחירת נמענים</mat-label>
                <!-- <input type="text" aria-label="manager" matInput [formControl]="myControl" [matAutocomplete]="auto"> -->
                <mat-chip-list #chipList aria-label="Fruit selection">
                    <mat-chip *ngFor="let fruit of fruits" [selectable]="selectable" [removable]="removable"
                        (removed)="remove(fruit)">
                        {{fruit.FirstName}} {{fruit.LastName}}
                        <mat-icon matChipRemove>cancel</mat-icon>
                    </mat-chip>
                    <input placeholder="בחר נמען נוסף" #fruitInput [formControl]="myControl" [matAutocomplete]="auto"
                        [matChipInputFor]="chipList" [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                        (matChipInputTokenEnd)="add($event)" style="margin-top: 30px;">
                </mat-chip-list>
                <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selected($event)">
                    <mat-option *ngFor="let option of filteredOptions | async" [value]="option">
                        {{option.FirstName}} {{option.LastName}}
                    </mat-option>
                </mat-autocomplete>
            </mat-form-field>
        </form>
        <!-- </div> -->
        <!-- <div class="col-3"> -->
        <!-- </div> -->
    </div>
    <div class="row" style="justify-content: left;">
        <button mat-raised-button [disabled]="disableBtn" class="btn btn-primary btn-raised float-left"
            (click)="shareReportWithOthers()" matTooltip="שליחה">
            <span style="transform: rotate(180deg);" class="material-icons">
                send
            </span>
        </button>
    </div>
</mat-card>
