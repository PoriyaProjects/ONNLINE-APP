<div class="dept-plan-return" dir="rtl">
  <header class="dept-plan-return__header">
    <div class="dept-plan-return__header-icon" aria-hidden="true">
      <mat-icon>edit_note</mat-icon>
    </div>
    <div class="dept-plan-return__header-text">
      <h2 class="dept-plan-return__title">{{ dialogTitle }}</h2>
      <p class="dept-plan-return__subtitle">{{ dialogSubtitle }}</p>
    </div>
    <button mat-icon-button type="button" class="dept-plan-return__close" (click)="close()" aria-label="סגירה">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div mat-dialog-content class="dept-plan-return__body">
    <div *ngIf="loading" class="dept-plan-return__loading">
      <mat-spinner diameter="36"></mat-spinner>
      <span>טוען רשימת ניתוחים...</span>
    </div>

    <div *ngIf="!loading && errorMessage" class="dept-plan-return__empty">
      {{ errorMessage }}
    </div>

    <ng-container *ngIf="!loading && !errorMessage">
      <p class="dept-plan-return__hint">
        <mat-icon>mail_outline</mat-icon>
        נושא המייל: <strong>{{ emailSubjectLine }}</strong>
      </p>

      <mat-form-field appearance="outline" class="dept-plan-return__field" *ngIf="isUnifiedMode || isSendMode">
        <mat-label>הערה כללית על הסידור (אופציונלי)</mat-label>
        <textarea matInput rows="2" [(ngModel)]="generalComment"
          placeholder="הערה כללית למזכירת המחלקה ומנהל המחלקה"></textarea>
      </mat-form-field>

      <div class="dept-plan-return__cards" *ngIf="surgeries.length > 0">
        <article class="dept-plan-return__card" *ngFor="let surgery of surgeries; let i = index">
          <header class="dept-plan-return__card-head">
            <span class="dept-plan-return__card-index">{{ i + 1 }}</span>
            <div class="dept-plan-return__card-meta">
              <strong>{{ surgery.patientLabel }}</strong>
              <span>{{ surgery.procedureName }}</span>
              <span *ngIf="surgery.surgeon">מנתח: {{ surgery.surgeon }}</span>
            </div>
          </header>

          <div class="dept-plan-return__card-grid">
            <div class="dept-plan-return__card-field" *ngIf="surgery.existingNote">
              <label>הערה קיימת</label>
              <p>{{ surgery.existingNote }}</p>
            </div>

            <div class="dept-plan-return__card-field">
              <label>הערה על הסידור</label>
              <textarea class="dept-plan-return__textarea" rows="2" [(ngModel)]="surgery.coordinatorComment"
                placeholder="אופציונלי — לפי ניתוח"></textarea>
            </div>

            <div class="dept-plan-return__card-field">
              <label>סטטוס</label>
              <div class="dept-plan-return__status-group">
                <button *ngFor="let status of statusOptions" type="button"
                  class="dept-plan-return__status-btn dept-plan-return__status-btn--compact"
                  [class.dept-plan-return__status-btn--active]="surgery.treatmentStatus === status"
                  [ngClass]="getStatusButtonClass(status)"
                  (click)="setSurgeryStatus(surgery, status)">
                  {{ statusLabels[status] }}
                </button>
              </div>
            </div>

            <div class="dept-plan-return__card-field">
              <label>תשובת מחלקה</label>
              <textarea class="dept-plan-return__textarea" rows="2" [(ngModel)]="surgery.departmentResponseText"
                placeholder="תגובה על ההערה — אופציונלי"></textarea>
            </div>
          </div>
        </article>
      </div>
    </ng-container>
  </div>

  <div mat-dialog-actions class="dept-plan-return__footer">
    <button mat-stroked-button type="button" (click)="close()">סגירה</button>
    <button *ngIf="isUnifiedMode || isSendMode" mat-raised-button color="primary" type="button"
      class="dept-plan-return__send-btn"
      [disabled]="saving || surgeries.length === 0"
      (click)="saveAndSend()">
      <mat-icon>send</mat-icon>
      שליחה למחלקה
    </button>
    <button *ngIf="isUnifiedMode || isRespondMode" mat-stroked-button color="primary" type="button"
      class="dept-plan-return__send-btn"
      [disabled]="saving"
      (click)="saveDepartmentResponse()">
      <mat-icon>save</mat-icon>
      שמירת תגובה
    </button>
    <button *ngIf="isUnifiedMode || isRespondMode" mat-raised-button color="accent" type="button"
      class="dept-plan-return__send-btn"
      [disabled]="saving"
      (click)="saveAndSendResponse()">
      <mat-icon>mark_email_read</mat-icon>
      שליחה במייל
    </button>
  </div>
</div>
