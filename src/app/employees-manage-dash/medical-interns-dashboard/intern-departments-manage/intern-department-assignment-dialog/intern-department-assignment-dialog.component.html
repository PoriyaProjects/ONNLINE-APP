<div dir="rtl">
  <h2 mat-dialog-title>הקצאת מחלקה לסטאג'ר</h2>
  <mat-dialog-content>
    <form [formGroup]="assignmentForm">
      <div class="row">
        <div class="col-6">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>תאריך התחלה תקופת הסטאג'ר</mat-label>
            <mat-select formControlName="InternPeriod" (selectionChange)="getDepartmentsForPeriod($event.value); test($event.value)">
              <mat-option value="">בחר חודש</mat-option>
              <mat-option *ngFor="let opt of monthOptions" [value]="opt.value">{{ opt.label }}</mat-option>
            </mat-select>
            <mat-error *ngIf="assignmentForm.get('InternPeriod')?.hasError('required') && assignmentForm.get('InternPeriod')?.touched">שדה חובה</mat-error>
          </mat-form-field>
        </div>
        <div class="col-6">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>תאריך סיום תקופת הסטאג'ר</mat-label>
            <input matInput [matDatepicker]="endPicker" formControlName="InternPeriodEnd">
            <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
            <mat-datepicker #endPicker></mat-datepicker>
            <mat-error
              *ngIf="assignmentForm.get('InternPeriodEnd')?.hasError('required') && assignmentForm.get('InternPeriodEnd')?.touched">שדה
              חובה</mat-error>
            <mat-error
              *ngIf="assignmentForm.get('InternPeriodEnd')?.hasError('matDatepickerParse') && assignmentForm.get('InternPeriodEnd')?.touched">תאריך
              שגוי</mat-error>
          </mat-form-field>
        </div>
      </div>
      <div class="row">
        <div class="col-12">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>מחלקה</mat-label>
            <mat-select formControlName="DepartnentCodeFirst" [disabled]="departmentsLoading">
              <mat-option [value]="''">בחר מחלקה</mat-option>
              <mat-option *ngFor="let dept of departments" [value]="dept.DepartnentCodeFirst">
                {{ dept.DepartnentDescripton }} - {{ dept.countMed }} מתוכננים
              </mat-option>
            </mat-select>
            <mat-hint *ngIf="departmentsLoading">טוען מחלקות...</mat-hint>
            <mat-error *ngIf="assignmentForm.get('DepartnentCodeFirst')?.hasError('required')">שדה חובה</mat-error>
          </mat-form-field>
        </div>
      </div>
      <!-- <div class="row">
        <div class="col-12">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>סטטוס זמינות</mat-label>
            <input matInput formControlName="AvailabilityStatus" placeholder="הערה על זמינות">
          </mat-form-field>
        </div>
      </div> -->
    </form>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button (click)="close()">ביטול</button>
    <button mat-raised-button color="primary" [disabled]="assignmentForm.invalid || saveBtnWait" (click)="save()">
      <span *ngIf="!saveBtnWait">שמור</span>
      <span *ngIf="saveBtnWait">המתן...</span>
    </button>
  </mat-dialog-actions>
</div>
