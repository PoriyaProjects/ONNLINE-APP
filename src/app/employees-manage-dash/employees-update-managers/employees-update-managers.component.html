<mat-card class="mt-3 p-3" dir="rtl">
  <button mat-mini-fab color="warn" class="close" matTooltip="סגירה" aria-label="Close" mat-dialog-close>
    <mat-icon>cancel</mat-icon>
  </button>
  <mat-card-title class="text-center">רשימת מנהלים</mat-card-title>
  <mat-divider></mat-divider>
  <div class="table-responsive mb-5">
    <table mat-table [dataSource]="managers" class="mat-elevation-z8">

      <ng-container matColumnDef="deptSektor">
        <th mat-header-cell *matHeaderCellDef>מזהה מחלקה וסקטור</th>
        <td mat-cell *matCellDef="let manager">{{ manager.EmployeeIndex }}</td>
      </ng-container>

      <ng-container matColumnDef="deptName">
        <th mat-header-cell *matHeaderCellDef>מחלקה</th>
        <td mat-cell *matCellDef="let manager">{{ manager.EmployeeIndexDesc }}</td>
      </ng-container>

      <ng-container matColumnDef="managerId">
        <th mat-header-cell *matHeaderCellDef>מנהל</th>
        <td mat-cell *matCellDef="let manager">
          <mat-form-field>
            <mat-label>מספר טלפון</mat-label>
            <input type="text" matInput autocomplete="off" [(ngModel)]="manager.ManagerEmployeeID" />
          </mat-form-field>
        </td>
      </ng-container>

      <ng-container matColumnDef="update">
        <th mat-header-cell *matHeaderCellDef>עדכן</th>
        <td mat-cell *matCellDef="let manager">
          <button mat-raised-button (click)="submitSelected(manager)">בצע</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
  <!-- <div class="actions text-right mt-3">
    <button mat-raised-button color="primary" (click)="submitSelected()">Submit</button>
  </div> -->
</mat-card>
