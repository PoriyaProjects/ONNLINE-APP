<div id="page-toshow">
    <h1 class="page-title text-center">ניהול מורשים</h1>

    <div class="container-fluid pb-60">
        <div class="row">
            <div  class="col">
                <mat-form-field>
                    <mat-label>Search</mat-label>
                    <input
                        matInput
                        (keyup)="applyFilter($event)"
                        placeholder="Search"
                        #input
                    />
                </mat-form-field>
                <div class="table-responsive">
                    <div class="table-spinner-container">
                        <!-- <mat-form-field>
                                <input matInput (keyup)="applyFilter($event.target.value)" placeholder="חפש">
                            </mat-form-field> -->
                        <table
                            class="table"
                            mat-table
                            class="text-left w-100"
                            [dataSource]="dataSource"
                            matSort
                        >
                            <ng-container matColumnDef="RowID">
                                <th mat-header-cell *matHeaderCellDef>מס'</th>
                                <td mat-cell *matCellDef="let element">
                                    {{ element.RowID }}
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="SupplierID">
                                <th mat-header-cell *matHeaderCellDef>
                                    Supplier
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    {{ element.SupplierNameToShow }}
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="AuthorizedConnectionName">
                                <th mat-header-cell *matHeaderCellDef>Connection Name</th>
                                <td mat-cell *matCellDef="let element">
                                    {{ element.AuthorizedConnectionName }}
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="AuthorizedConnectionID">
                                <th mat-header-cell *matHeaderCellDef>
                                    Connection ID
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    {{ element.AuthorizedConnectionID }}
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="AuthorizedIDPic">
                                <th mat-header-cell *matHeaderCellDef>
                                    ID Pic 
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    <a *ngIf="element.AuthorizedIDPic  != '' " href="{{ element.AuthorizedIDPic }}" target="_blank">לחץ כאן</a>
                                </td>
                            </ng-container> 
                            <ng-container matColumnDef="AuthorizedAM">
                                <th mat-header-cell *matHeaderCellDef>
                                    AM
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    <a *ngIf="element.AuthorizedAM != ''" href="{{ element.AuthorizedAM }}" target="_blank">לחץ כאן</a>
                                </td>
                            </ng-container> 
                            <ng-container matColumnDef="AuthorizedNDA">
                                <th mat-header-cell *matHeaderCellDef>
                                    NDA
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    <a *ngIf="element.AuthorizedNDA != '' " href="{{ element.AuthorizedNDA }}" target="_blank">לחץ כאן</a>
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="editAuthorized">
                                <th
                                    mat-header-cell
                                    *matHeaderCellDef
                                    width="50"
                                >
                                    Edit
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    <div class="example-button-container">
                                        <button
                                            (click)="editRow(element)"
                                            class="row-data"
                                            mat-mini-fab
                                            color="primary"
                                        >
                                            <mat-icon>create</mat-icon>
                                        </button>
                                    </div>
                                </td>
                            </ng-container>

                            <ng-container matColumnDef="deleteServer">
                                <th
                                    mat-header-cell
                                    *matHeaderCellDef
                                    width="50"
                                >
                                    Delete
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    <div class="example-button-container">
                                        <button
                                            (click)="deleteRow(element)"
                                            class="row-data"
                                            mat-mini-fab
                                            color="primary"
                                        >
                                            <mat-icon>delete</mat-icon>
                                        </button>
                                    </div>
                                </td>
                            </ng-container>
                            <tr
                                mat-header-row
                                *matHeaderRowDef="displayedColumns"
                            ></tr>
                            <tr
                                mat-row
                                *matRowDef="let row; columns: displayedColumns"
                            ></tr>
                        </table>
                    </div>
                    <!-- PAGINATION -->
                    <mat-paginator
                        [length]="resultsLength"
                        [pageSizeOptions]="[5, 10, 20, 50, 100]"
                        [pageSize]="15"
                        showFirstLastButtons
                    ></mat-paginator>
                </div>
            </div>
        </div>
    </div>
</div>

<button type="button" id="GroupBtn" (click)="open()" mat-fab color="primary">
    <i class="material-icons">add</i>
</button>
