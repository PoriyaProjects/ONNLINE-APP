<!-- app.component.html -->

<mat-sidenav-container class="sidenav-container">
    <mat-sidenav-content class="sidenav-content">
        <mat-toolbar color="primary">
            <!-- <button type="button" aria-label="Toggle sidenav" mat-icon-button>
                <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
            </button> -->
            <span>{{ currentContact?.name }}</span>
        </mat-toolbar>
        <!-- Your chat area goes here -->
        <div class="row">
            <div class="col-3">
                <mat-list role="list">
                    <mat-list-item role="listitem" class="list-item" *ngFor="let contact of contacts"
                        (click)="openChat(contact)">
                        <mat-icon mat-list-icon>account_circle</mat-icon>
                        <span mat-line>{{ contact.name }} - {{contact.phone}}</span>
                        <!-- <span mat-line class="secondary">{{ contact.status }}</span> -->
                    </mat-list-item>
                </mat-list>
                <!-- <mat-sidenav #drawer class="sidenav">
                    <mat-toolbar>
                        WhatsApp Web
                    </mat-toolbar>
                     Your contact list or chat list goes here
                    <mat-nav-list>
                        <a mat-list-item *ngFor="let contact of contacts" (click)="openChat(contact)">
                            <mat-icon mat-list-icon>account_circle</mat-icon>
                            <span mat-line>{{ contact.name }}</span>
                            <span mat-line class="secondary">{{ contact.status }}</span>
                        </a>
                    </mat-nav-list>
                </mat-sidenav> -->
            </div>
            <div class="col-9">
                <div class="chat-container">
                    <div *ngFor="let message of currentContact.messages"
                        [ngClass]="{'message-sent': message.sentByMe, 'message-received': !message.sentByMe}">
                        {{ message.content }}
                    </div>
                </div>
                <!-- Your input area goes here -->
                <div class="input-container">
                    <mat-form-field class="message-input">
                        <input matInput placeholder="Type your message" [(ngModel)]="newMessage">
                    </mat-form-field>
                    <button mat-icon-button (click)="sendMessage()">
                        <mat-icon>send</mat-icon>
                    </button>
                </div>
            </div>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
