<div class="feed-line-container">
  <div class="feed-line">
    <div class="feed-item" *ngFor="let item of feedItems">
      <span class="feed-time">{{ item.RecordDate | date: 'MM-dd-yyyy HH:mm' }}</span>
      <textarea [value]="item.Description" (blur)="updateFeedLineContent($event.target.value, item.Row_ID)"
        *ngIf="user_name == 'adahabre' || user_name == 'sbarniv' || user_name == 'talontimss'"></textarea>
      <span class="feed-content" *ngIf="user_name != 'adahabre' && user_name != 'sbarniv' && user_name != 'talontimss'"
        [innerHTML]="transformText(item.Description)"></span>
    </div>
  </div>
  <button type="submit" mat-raised-button class="add-btn"
    *ngIf="user_name == 'adahabre' || user_name == 'sbarniv' || user_name == 'talontimss'"
    (click)="updateFeedLineContent('', 0)">
    <mat-icon>add</mat-icon>
  </button>
</div>
