<h2 class="page-title text-center">איפוס סיסמה לוינדוס</h2>
<div class="user-validation-page" dir="rtl">
    <div class="content">
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>שם משתמש לוינדוס</mat-label>
            <input matInput [(ngModel)]="username" (keyup)="typingUserName()" />
        </mat-form-field>
        <div class="info">
            <p>{{ messageToUser }}</p>
            <p *ngIf="!sendingBtn && validationCode != undefined">אפשר לקבל קוד אימות בעוד דקה</p>
            <button mat-stroked-button color="warn" (click)="generateRandomNumber()"
                *ngIf="validationfromwhatsapp === '' && username !== '' && sendingBtn">
                שלח קוד אימות
            </button>
        </div>
        <mat-form-field appearance="outline" class="full-width" *ngIf="validationCode">
            <mat-label>הכנס קוד אימות שקיבלת</mat-label>
            <input matInput [(ngModel)]="validationfromwhatsapp" />
        </mat-form-field>
        <hr>
        <button mat-button color="primary" (click)="onSubmit('reset')"
            *ngIf="validationfromwhatsapp !== '' && !loading">
            איפוס
        </button>
        <p *ngIf="loading">מאפסים את הסיסמה שלך, אנא המתן...</p>
    </div>
</div>
