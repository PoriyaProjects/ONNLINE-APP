<div class="shortcuts-container">
  <mat-toolbar style="background-color: #3ab7b7;">
    <span>ניהול קיצורי דרך</span>
    <span class="spacer"></span>
    <button mat-raised-button color="accent" (click)="openShortcutDialog()">הוספת קיצור דרך</button>
  </mat-toolbar>

  <mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container matColumnDef="Row_ID">
      <mat-header-cell *matHeaderCellDef> מזהה </mat-header-cell>
      <mat-cell *matCellDef="let shortcut"> {{shortcut.Row_ID}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="Title">
      <mat-header-cell *matHeaderCellDef> תיאור </mat-header-cell>
      <mat-cell *matCellDef="let shortcut"> {{shortcut.Title}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="Link">
      <mat-header-cell *matHeaderCellDef> קישור </mat-header-cell>
      <mat-cell *matCellDef="let shortcut"> {{shortcut.Link}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="Image">
      <mat-header-cell *matHeaderCellDef> קישור לתמונה </mat-header-cell>
      <mat-cell *matCellDef="let shortcut">
        <img [src]="shortcut.Image" alt="Shortcut Image" width="50">
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="Status">
      <mat-header-cell *matHeaderCellDef> סטטוס </mat-header-cell>
      <mat-cell *matCellDef="let shortcut"> {{shortcut.Status ? 'פעיל' : 'לא פעיל'}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="Actions">
      <mat-header-cell *matHeaderCellDef> פעולות </mat-header-cell>
      <mat-cell *matCellDef="let shortcut">
        <button mat-icon-button color="primary" (click)="openShortcutDialog(shortcut)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteShortcut(shortcut.Row_ID)">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>
</div>
