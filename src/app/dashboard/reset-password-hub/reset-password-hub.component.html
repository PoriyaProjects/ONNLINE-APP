<div class="hub-container">
  
    <header class="hub-header">
      <div class="icon-pulse">
        <span class="material-icons">lock_reset</span>
      </div>
      <h1>מרכז איפוס סיסמה</h1>
      <p>נא לבחור את המערכת שברצונך לאיפוס את סיסמתך</p>
    </header>
  
    <div class="cards-wrapper">
  
      <div class="reset-card card-emerald" (click)="navigateTo('/namer-user-actions')">
        <div class="card-bg-glow"></div>
        <div class="card-content">
          <div class="icon-container">
            <span class="material-icons">apps</span>
          </div>
          <h3>נמר/Namer</h3>
          <p>איפוס סיסמה למערכת הנמר</p>
          
          <div class="card-action">
            <span>איפוס סיסמה</span>
            <span class="material-icons">arrow_forward</span>
          </div>
        </div>
      </div>
      
      <div class="reset-card card-blue" (click)="navigateTo('/windows-user-actions')">
        <div class="card-bg-glow"></div>
        <div class="card-content">
          <div class="icon-container">
            <span class="material-icons">desktop_windows</span>
          </div>
          <h3>וידוס/Windows</h3>
          <p>איפוס סיסמה לחשבון/Windows מחשב</p>
          
          <div class="card-action">
            <span>איפוס סיסמה</span>
            <span class="material-icons">arrow_forward</span>
          </div>
        </div>
      </div>
  
    </div>
  </div>
