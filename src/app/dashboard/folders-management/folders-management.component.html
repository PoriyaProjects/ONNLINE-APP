<mat-card>
    <mat-card-title>📁 Folder Management</mat-card-title>
    <mat-card-subtitle>Manage your folders easily</mat-card-subtitle>

    <div class="table-actions">
        <mat-form-field appearance="outline" style="width: 250px;">
            <mat-label>Search</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Search folders">
        </mat-form-field>
        <button mat-raised-button color="primary" (click)="openDialog()">
            <mat-icon>add</mat-icon> Add Folder
        </button>
    </div>

    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

        <!-- Title -->
        <ng-container matColumnDef="Title">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Title </th>
            <td mat-cell *matCellDef="let folder">{{ folder.Title }}</td>
        </ng-container>

        <!-- Link -->
        <ng-container matColumnDef="Link">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Link </th>
            <td mat-cell *matCellDef="let folder" class="truncate">{{ folder.Link }}</td>
        </ng-container>

        <!-- Image -->
        <ng-container matColumnDef="Image">
            <th mat-header-cell *matHeaderCellDef> Image </th>
            <td mat-cell *matCellDef="let folder">
                <img [src]="folder.Image" alt="" width="40" height="40" style="border-radius: 4px;">
            </td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="Status">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
            <td mat-cell *matCellDef="let folder">
                <mat-chip color="{{ folder.Status ? 'primary' : 'warn' }}" selected>
                    {{ folder.Status ? 'Active' : 'Inactive' }}
                </mat-chip>
            </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Actions </th>
            <td mat-cell *matCellDef="let folder">
                <button mat-icon-button color="accent" (click)="openDialog(folder)">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="delete(folder.Row_ID!)">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
</mat-card>
