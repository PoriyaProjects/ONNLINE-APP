<mat-card dir="rtl" class="rtl-card">

  <mat-card-title>📁 ניהול תיקיות</mat-card-title>
  <mat-card-subtitle>ניהול תיקיות בצורה פשוטה ונוחה</mat-card-subtitle>

  <div class="table-actions rtl-actions">
    <button mat-raised-button color="primary" (click)="openDialog()">
      <mat-icon>add</mat-icon>
      הוספת תיקייה
    </button>

    <mat-form-field appearance="outline" style="width: 250px;">
      <mat-label>חיפוש</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="חיפוש תיקיות">
    </mat-form-field>
  </div>

  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 rtl-table">

    <!-- Title -->
    <ng-container matColumnDef="Title">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> כותרת </th>
      <td mat-cell *matCellDef="let folder">{{ folder.Title }}</td>
    </ng-container>

    <!-- Link -->
    <ng-container matColumnDef="Link">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> קישור </th>
      <td mat-cell *matCellDef="let folder" class="truncate">{{ folder.Link }}</td>
    </ng-container>

    <!-- Image -->
    <ng-container matColumnDef="Image">
      <th mat-header-cell *matHeaderCellDef> תמונה </th>
      <td mat-cell *matCellDef="let folder">
        <img
          [src]="folder.Image"
          alt="תמונה"
          width="40"
          height="40"
          style="border-radius: 4px;">
      </td>
    </ng-container>

    <!-- Status -->
    <ng-container matColumnDef="Status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> סטטוס </th>
      <td mat-cell *matCellDef="let folder">
        <mat-chip
          [color]="folder.Status ? 'primary' : 'warn'"
          selected>
          {{ folder.Status ? 'פעיל' : 'לא פעיל' }}
        </mat-chip>
      </td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> פעולות </th>
      <td mat-cell *matCellDef="let folder" class="actions-cell">
        <button mat-icon-button color="accent" (click)="openDialog(folder)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="delete(folder.Row_ID!)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

  <mat-paginator
    [pageSizeOptions]="[5, 10, 25]"
    showFirstLastButtons>
  </mat-paginator>

</mat-card>
