<div class="training-dialog training-dialog--danger">
  <div class="dialog-icon" aria-hidden="true"><mat-icon>person_outline</mat-icon></div>
  <h2 mat-dialog-title>ביטול הרשמת עובד</h2>
  <mat-dialog-content>
    <p><strong>{{ data.employeeName }}</strong></p>
    <p class="dialog-desc">{{ data.courseName }} · {{ data.sessionDate }}</p>
    <mat-form-field appearance="outline" class="full" style="width:100%">
      <mat-label>סיבה *</mat-label>
      <textarea matInput rows="3" [(ngModel)]="reason"></textarea>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button type="button" (click)="cancel()" [disabled]="submitting">חזרה</button>
    <button mat-flat-button color="warn" type="button" (click)="confirm()" [disabled]="submitting || !reason.trim()">אישור ביטול</button>
  </mat-dialog-actions>
</div>
