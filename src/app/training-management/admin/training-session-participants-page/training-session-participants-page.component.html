<section class="tm-page participants-page" dir="rtl">
  <button mat-button type="button" (click)="back()"><mat-icon>arrow_forward</mat-icon> חזרה למועדים</button>

  <header class="participants-header" *ngIf="session">
    <app-training-page-header
      icon="group"
      title="נרשמים למועד"
      [subtitle]="session.CourseName + ' · ' + dateLabel(session.SessionDate) + ' · ' + session.StartTime + '–' + session.EndTime + ' · ' + (session.Location || '—')"
      [counterLabel]="'קיבולת ' + session.RegisteredCount + '/' + session.Capacity + ' (פנויים ' + session.AvailablePlaces + ')'"
    ></app-training-page-header>
    <button
      mat-flat-button
      type="button"
      class="tm-btn-primary add-btn"
      (click)="openRegister()"
      [disabled]="busy || session.AvailablePlaces <= 0"
    >
      <mat-icon>person_add</mat-icon>
      הוספת נרשם
    </button>
  </header>

  <div class="tm-filter-card" *ngIf="!loading">
    <div class="filter-title">
      <mat-icon>filter_list</mat-icon>
      מסננים
    </div>
    <mat-form-field appearance="outline" class="grow">
      <mat-label>חיפוש עובד</mat-label>
      <input matInput [(ngModel)]="searchText" (ngModelChange)="applyFilters()" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>סטטוס הרשמה</mat-label>
      <mat-select [(ngModel)]="registrationStatusFilter" (ngModelChange)="applyFilters()">
        <mat-option value="">הכל</mat-option>
        <mat-option value="1">רשום</mat-option>
        <mat-option value="0">בוטל</mat-option>
        <mat-option value="2">נכח</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>נוכחות</mat-label>
      <mat-select [(ngModel)]="attendanceStatusFilter" (ngModelChange)="applyFilters()">
        <mat-option value="">הכל</mat-option>
        <mat-option value="1">אושר</mat-option>
        <mat-option value="2">ממתין</mat-option>
        <mat-option value="3">ידני</mat-option>
        <mat-option value="0">בוטל</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <app-training-skeleton *ngIf="loading" variant="cards" label="טוען נרשמים…"></app-training-skeleton>
  <app-training-error-state *ngIf="!loading && errorMessage" [message]="errorMessage" (retry)="load()"></app-training-error-state>
  <app-training-empty-state *ngIf="!loading && !errorMessage && filtered.length === 0" title="עדיין לא נרשמו עובדים למועד זה."></app-training-empty-state>

  <div class="list" *ngIf="!loading && !errorMessage && filtered.length">
    <article class="tm-list-card row-card" *ngFor="let row of filtered; trackBy: trackById">
      <div>
        <h3>{{ row.EmployeeFullName || row.EmployeeID }}</h3>
        <p class="meta">מס׳ עובד: {{ row.EmployeeID }} · נרשם: {{ dateLabel(row.RegisteredAt) }}</p>
        <div class="badges">
          <app-training-status-badge kind="registration" [status]="row.Status" tone="info"></app-training-status-badge>
          <app-training-status-badge kind="attendance" [status]="row.AttendanceStatus" tone="neutral"></app-training-status-badge>
          <app-training-status-badge kind="certificate" [status]="row.CertificateStatus" tone="neutral"></app-training-status-badge>
        </div>
      </div>
      <div class="actions">
        <button mat-stroked-button type="button" (click)="openAttendance(row)" [disabled]="busy">
          <mat-icon>fact_check</mat-icon> נוכחות ידנית
        </button>
        <button mat-button color="warn" type="button" *ngIf="row.Status === 1" (click)="openCancel(row)" [disabled]="busy">
          <mat-icon>cancel</mat-icon> ביטול הרשמה
        </button>
      </div>
    </article>
  </div>
</section>
