<div class="empty-state" role="status">
  <div class="empty-icon-wrap" aria-hidden="true">
    <mat-icon class="empty-icon">{{ icon }}</mat-icon>
  </div>
  <h2 class="empty-title">{{ title }}</h2>
  <p *ngIf="message" class="empty-message">{{ message }}</p>
  <button
    *ngIf="actionLabel"
    mat-stroked-button
    color="primary"
    type="button"
    (click)="onAction()"
  >
    {{ actionLabel }}
  </button>
</div>
