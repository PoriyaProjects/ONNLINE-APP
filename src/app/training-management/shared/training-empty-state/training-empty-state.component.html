<div class="empty-state" role="status">
  <mat-icon class="empty-icon" aria-hidden="true">inbox</mat-icon>
  <h2 class="empty-title">{{ title }}</h2>
  <p *ngIf="message" class="empty-message">{{ message }}</p>
  <button
    *ngIf="actionLabel"
    mat-stroked-button
    color="primary"
    type="button"
    (click)="onAction()"
  >
    {{ actionLabel }}
  </button>
</div>
