<div class="training-dialog">
  <div class="dialog-icon" aria-hidden="true"><mat-icon>play_circle_filled</mat-icon></div>
  <h2 mat-dialog-title>פתיחת חלון נוכחות</h2>
  <mat-dialog-content>
    <p><strong>{{ data.courseName }}</strong></p>
    <p>{{ data.sessionDate }} · {{ data.timeLabel }}</p>
    <p>שעה נוכחית: {{ data.currentTimeLabel }}</p>
    <p *ngIf="data.windowHint">{{ data.windowHint }}</p>
    <p class="dialog-desc">לאחר הפתיחה ניתן לסמן נוכחות לכל משתתף ברשימה.</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button type="button" (click)="cancel()" [disabled]="submitting">ביטול</button>
    <button mat-flat-button type="button" class="tm-btn-primary" (click)="confirm()" [disabled]="submitting">
      פתיחת חלון נוכחות
    </button>
  </mat-dialog-actions>
</div>
