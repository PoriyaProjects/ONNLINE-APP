<section class="tm-page report-page" dir="rtl">
  <h3 class="print-only">דוח עמידה בהכשרות חובה</h3>
  <app-training-report-filters preset="compliance" (apply)="onFilterApply($event)"></app-training-report-filters>
  <div class="tm-export-bar no-print">
    <button mat-flat-button color="primary" type="button" (click)="exportExcel()" [disabled]="!rows.length">ייצוא Excel</button>
    <button mat-stroked-button type="button" (click)="print()">הדפסה</button>
  </div>
  <div class="tm-loading-wrap" *ngIf="loading"><mat-spinner diameter="36"></mat-spinner><span>טוען…</span></div>
  <app-training-error-state *ngIf="!loading && errorMessage" [title]="complianceRulesMissing ? 'כללי התאמה חסרים' : 'דוח עמידה'" [message]="errorMessage" (retry)="load()"></app-training-error-state>
  <app-training-empty-state *ngIf="!loading && !errorMessage && !rows.length" title="אין תוצאות" message="לא נמצאו נתוני עמידה בהכשרות החובה."></app-training-empty-state>
  <div class="tm-table-wrap" *ngIf="!loading && rows.length">
    <table mat-table [dataSource]="rows" class="report-table">
      <ng-container matColumnDef="EmployeeID"><th mat-header-cell *matHeaderCellDef>עובד</th><td mat-cell *matCellDef="let r">{{ r.EmployeeID }}</td></ng-container>
      <ng-container matColumnDef="EmployeeFullName"><th mat-header-cell *matHeaderCellDef>שם</th><td mat-cell *matCellDef="let r">{{ r.EmployeeFullName }}</td></ng-container>
      <ng-container matColumnDef="DepartmentCode"><th mat-header-cell *matHeaderCellDef>מחלקה</th><td mat-cell *matCellDef="let r">{{ r.DepartmentCode || '—' }}</td></ng-container>
      <ng-container matColumnDef="CourseName"><th mat-header-cell *matHeaderCellDef>קורס</th><td mat-cell *matCellDef="let r">{{ r.CourseName }}</td></ng-container>
      <ng-container matColumnDef="ComplianceStatus"><th mat-header-cell *matHeaderCellDef>סטטוס</th><td mat-cell *matCellDef="let r">{{ statusLabel(r.ComplianceStatus) }}</td></ng-container>
      <ng-container matColumnDef="LastCompletedAt"><th mat-header-cell *matHeaderCellDef>השלמה</th><td mat-cell *matCellDef="let r">{{ formatDate(r.LastCompletedAt) }}</td></ng-container>
      <ng-container matColumnDef="CertificateExpiresAt"><th mat-header-cell *matHeaderCellDef>תוקף</th><td mat-cell *matCellDef="let r">{{ formatDate(r.CertificateExpiresAt) }}</td></ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator class="no-print" [length]="totalCount" [pageSize]="filter.Take || 50" [pageSizeOptions]="[25, 50, 100]" (page)="onPage($event)"></mat-paginator>
  </div>
</section>
