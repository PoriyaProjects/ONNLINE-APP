   <div class="table-container">

    <!-- 🔍 Top Search + Export -->
    <div class="table-controls" style="width: 100%; overflow: hidden; margin-bottom: 12px;">
      <mat-form-field class="top-search-field" appearance="outline" style="width:80%; float:right;">
        <mat-label>חיפוש</mat-label>
        <input
          matInput
          [(ngModel)]="filterValue"
          (input)="applyFilter()"
          placeholder="תנאי סינון"
        />
      </mat-form-field>
  
      <button
        mat-raised-button
        class="excel-button"
        (click)="exportToExcel()"
        style="float: left; background-color: #5ed175; color: white; white-space: nowrap;"
      >
        <img
          src="assets/images/excel.png"
          alt="יצוא לאקסל"
          width="20"
          height="20"
          style="margin-right: 8px; vertical-align: middle;"
        />
      
      </button>
    </div>
  
    <!-- 📋 Table -->
    <div class="table-scroll-wrapper" style="clear: both;">
      <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8" style="width: 100%;">
        <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
          <th mat-header-cell *matHeaderCellDef mat-sort-header sticky [disableClear]="true">
            {{ column }}
          </th>
          <!-- <td mat-cell *matCellDef="let row">{{ row[column] }}</td> -->
          <td mat-cell *matCellDef="let row">
            {{ formatCell(row[column]) }}
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  
    <!-- 📊 Totals + Paginator -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px; direction: rtl;">
      
      <!-- Totals Summary -->
      <div style="font-weight: bold; padding-right: 12px;">
        סה"כ רשומות: {{ dataSource.filteredData.length }} / {{ dataSource.data.length }}
        <ng-container *ngFor="let col of displayedColumns.slice(1)">
          <ng-container *ngIf="totalMap[col] !== undefined">
            | {{ col }}: {{ totalMap[col] }}
          </ng-container>
        </ng-container>
      </div>
  
      <!-- Paginator -->
      <mat-paginator [pageSizeOptions]="[20, 50, 100]" showFirstLastButtons></mat-paginator>
    </div>
  </div>
