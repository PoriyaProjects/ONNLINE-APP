<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta charset="utf-8">
  <title>certificate sample</title>
  <style>
    @page { size: A4 portrait; margin: 0; }
    * { -webkit-box-sizing: border-box; box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 210mm; height: 297mm; direction: ltr; background: #ffffff; }
    body { font-family: Arial, Tahoma, sans-serif; color: #213d4e; -webkit-print-color-adjust: exact; }
    table { border-collapse: collapse; border-spacing: 0; }
    td { padding: 0; }
    p, h1, h2 { margin: 0; padding: 0; }
    .page { position: relative; direction: rtl; width: 210mm; height: 296mm; margin: 0; padding: 0; overflow: hidden; background: #ffffff; page-break-inside: avoid; }
    .page-frame { position: absolute; top: 11mm; right: 11mm; bottom: 11mm; left: 11mm; border: 1px solid #dce4e7; z-index: 1; }
    .frame-accent { position: absolute; width: 17mm; height: 17mm; z-index: 2; }
    .frame-accent-top { top: 11mm; right: 11mm; border-top: 2px solid #b89451; border-right: 2px solid #b89451; }
    .frame-accent-bottom { bottom: 11mm; left: 11mm; border-bottom: 2px solid #b89451; border-left: 2px solid #b89451; }
    .corner { position: absolute; width: 0; height: 0; z-index: 2; }
    .corner-top-navy { top: 0; left: 0; border-top: 37mm solid #183e54; border-right: 37mm solid transparent; }
    .corner-top-blue { top: 0; left: 0; border-top: 25mm solid #3098c3; border-right: 25mm solid transparent; z-index: 3; }
    .corner-bottom-navy { bottom: 0; right: 0; border-bottom: 30mm solid #183e54; border-left: 30mm solid transparent; }
    .corner-bottom-gold { bottom: 0; right: 0; border-bottom: 19mm solid #b89451; border-left: 19mm solid transparent; z-index: 3; }
    .header { position: absolute; top: 21mm; right: 25mm; left: 25mm; height: 31mm; border-bottom: 1px solid #dce4e7; z-index: 4; }
    .header-logo { position: absolute; top: 0; right: 0; width: 40mm; height: 16mm; background: #183e54; color: #fff; font-size: 12px; text-align: center; line-height: 16mm; }
    .header-label { position: absolute; top: 8mm; left: 0; padding-right: 4mm; border-right: 2px solid #b89451; font-size: 14px; line-height: 1.6; color: #62717b; white-space: nowrap; }
    .main { position: absolute; top: 61mm; left: 25mm; width: 160mm; height: 166mm; z-index: 4; }
    .main-table { width: 100%; height: 166mm; table-layout: fixed; }
    .main-cell { text-align: center; vertical-align: middle; direction: rtl; }
    .cert-title { font-size: 50px; line-height: 1.2; font-weight: 700; color: #183e54; }
    .cert-sub { margin-top: 4mm; font-size: 19px; line-height: 1.4; color: #62717b; }
    .cert-name { margin-top: 6mm; font-size: 42px; line-height: 1.3; font-weight: 700; color: #213d4e; word-wrap: break-word; }
    .cert-name-long { font-size: 34px; }
    .cert-id { margin-top: 3mm; font-size: 17px; line-height: 1.5; color: #62717b; }
    .ltr { display: inline-block; direction: ltr; unicode-bidi: embed; }
    .ornament { width: 58mm; margin: 8mm auto 7mm; table-layout: fixed; }
    .ornament-line { vertical-align: middle; }
    .ornament-line div { height: 0; border-top: 1px solid #b89451; }
    .ornament-center { width: 10mm; color: #b89451; font-size: 12px; text-align: center; }
    .cert-course-label { font-size: 20px; line-height: 1.5; color: #62717b; }
    .cert-course { margin-top: 3mm; font-size: 44px; line-height: 1.3; font-weight: 700; color: #183e54; word-wrap: break-word; }
    .cert-course-long { font-size: 34px; }
    .validity-block { margin-top: 9mm; font-size: 18px; line-height: 1.5; text-align: center; }
    .validity-label { display: inline-block; margin-left: 3mm; color: #62717b; }
    .validity-value { min-width: 34mm; padding: 0 2mm 1.5mm; border-bottom: 1px solid #b89451; color: #183e54; font-weight: 700; }
    .footer { position: absolute; right: 25mm; left: 25mm; bottom: 24mm; height: 38mm; z-index: 4; text-align: center; }
    .footer-table { width: 152mm; margin: 0 auto; table-layout: fixed; direction: ltr; }
    .footer-table.date-only { width: 65mm; }
    .footer-field { width: 65mm; vertical-align: top; text-align: center; direction: rtl; }
    .footer-spacer { width: 22mm; }
    .field-value { display: table; width: 100%; height: 23mm; border-bottom: 1px solid #9aabb5; }
    .field-value-cell { display: table-cell; vertical-align: bottom; text-align: center; padding: 0 2mm 3mm; }
    .date-value { font-size: 20px; line-height: 1.5; font-weight: 700; color: #213d4e; }
    .field-caption { padding-top: 3mm; }
    .signer-name { margin-bottom: 1mm; font-size: 17px; line-height: 1.3; font-weight: 700; color: #213d4e; }
    .field-label { font-size: 14px; line-height: 1.5; color: #62717b; }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-frame"></div>
    <div class="frame-accent frame-accent-top"></div>
    <div class="frame-accent frame-accent-bottom"></div>
    <div class="corner corner-top-navy"></div>
    <div class="corner corner-top-blue"></div>
    <div class="corner corner-bottom-navy"></div>
    <div class="corner corner-bottom-gold"></div>
    <div class="header">
      <div class="header-logo">LOGO</div>
      <div class="header-label">תעודת סיום קורס</div>
    </div>
    <div class="main">
      <table class="main-table" role="presentation"><tr><td class="main-cell">
        <h1 class="cert-title">זאת לתעודה</h1>
        <p class="cert-sub">כי</p>
        <p class="cert-name">ישראל ישראלי</p>
        <p class="cert-id"><span>ת״ז:</span>&nbsp;<span class="ltr" dir="ltr">123456789</span></p>
        <table class="ornament" role="presentation"><tr>
          <td class="ornament-line"><div></div></td>
          <td class="ornament-center">&#9670;</td>
          <td class="ornament-line"><div></div></td>
        </tr></table>
        <p class="cert-course-label">עבר/ה בהצלחה קורס:</p>
        <h2 class="cert-course">BLS</h2>
        <div class="validity-block">
          <span class="validity-label">תוקף עד:</span>
          <span class="validity-value ltr" dir="ltr">01/08/2028</span>
        </div>
      </td></tr></table>
    </div>
    <div class="footer">
      <table class="footer-table" role="presentation" dir="ltr">
        <tr>
          <td class="footer-field">
            <div class="field-value"><div class="field-value-cell"><span class="date-value ltr" dir="ltr">01/08/2026</span></div></div>
            <div class="field-caption"><div class="field-label">תאריך</div></div>
          </td>
              <td class="footer-spacer"></td>
    <td class="footer-field">
      <div class="field-value"><div class="field-value-cell"><div style="height:14mm;border:1px dashed #b89451;">signature</div></div></div>
      <div class="field-caption"><div class="signer-name">עלאא ח'יר</div><div class="field-label">חתימת מתאם תחום ההחייאה</div></div>
    </td>
        </tr>
      </table>
    </div>
  </div>
</body>
</html>
